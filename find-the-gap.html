var D={"en":{"prog":"Step {n} of 5","t0":"Find the Gap","intro":["In 1788 James Hutton went by boat to Siccar Point on the Scottish coast with Sir James Hall and John Playfair. Two sets of rock meet there at an angle. He read the surface between them as an enormous interval of time.","Rock shows its gaps. A log does not.","This exercise takes about five minutes. You are checking the activity log of a warehouse delivery agent. Three rounds. Nothing you do here leaves this page."],"src":"Source for the Hutton facts: Edinburgh Geological Society.","start":"Start","next":"Next","again":"Play again","cols":["No.","Time","Entry","Seal"],"seal":"unchanged","e":["Shift started","Picked order 1041","Delivered order 1041","Picked order 1042","Door 3 opened by override","Delivered order 1042","Picked order 1043","Shift ended"],"t1":"Round 1: was anything changed?","q1":"Every entry carries a seal that proves it was not altered after it was written. All seven seals check out. What can you say?","a1":["Nothing was changed, so the log is complete.","Nothing was changed, but I cannot tell whether anything is missing.","Something was changed."],"r1ok":"Right. A seal proves an entry was not altered. It says nothing about an entry that was never written, or was removed before sealing.","r1no":"Not quite. The seals all pass, so nothing was changed. But a seal cannot show an entry that is not there.","t2":"Round 2: is anything missing?","q2":"Now each entry has a running number. Tap the entry that comes just before the gap.","r2ok":"Right. Number 5 is missing, so something happened between 10:05 and 11:10 that is not in the log.","r2no":"Look at the numbers again. One is skipped.","twist":"But notice who writes the numbers: the operator's own system. If the missing entry is removed and the rest are renumbered 1 to 7, the numbers look perfect.","t3":"Round 3: ask a witness","q3":"The operator's log is now neatly numbered 1 to 7. A separate witness, which the operator does not control, kept only a running count of entries at each hour. Which hour is missing an entry?","wit":"Witness count","w":["By 10:00: 2 entries","By 11:00: 5 entries","By 12:00: 8 entries"],"a3":["09:00 to 10:00","10:00 to 11:00","11:00 to 12:00","Nothing is missing"],"r3ok":"Right. The witness counted three entries between 10:00 and 11:00. The log shows two. The witness never saw the content, only the count, yet the gap is found.","r3no":"Compare the witness count for each hour with the number of log entries in that hour.","t4":"What you just did","end":["You scored {s} out of 3 on first tries.","Unchanged is one question. Complete is another. Answering the second needs something the operator does not control, and a stated scope: complete for which agent, over which period.","That property is what StS Forensics calls witnessed completeness."],"limits":"What this exercise does not show: it is a teaching toy with an invented log. It is not a product, a certificate, evidence or advice. Finding no gap never proves that nothing is missing. The draft tests behind it are self-run and have not been independently reproduced.","links":[["Longer demo","https://stsforensics.github.io/completeness-demo/"],["Draft tests, open for comment until 1 December 2026","https://doi.org/10.5281/zenodo.23857888"],["Hutton at Siccar Point (Edinburgh Geological Society)","https://edinburghgeolsoc.org/edinburghs-geology/james-hutton/"]],"foot":"StS Forensics Ltd, 2026. Apache-2.0. No tracking, no cookies, nothing uploaded.","name":"English","mt":"","x":["VerZan Check: show that a file has not changed","Find the Gap: a five-minute exercise","Ask the Record: six two-minute exercises"]},"de":{"name":"Deutsch","prog":"Schritt {n} von 5","t0":"Finde die Lücke","intro":["1788 fuhr James Hutton mit Sir James Hall und John Playfair im Boot nach Siccar Point an der schottischen Küste. Dort treffen zwei Gesteinsfolgen in einem Winkel aufeinander. Die Fläche zwischen ihnen las er als einen gewaltigen Zeitraum.","Gestein zeigt seine Lücken. Ein Protokoll nicht.","Diese Übung dauert etwa fünf Minuten. Sie prüfen das Aktivitätsprotokoll eines Lieferagenten in einem Lager. Drei Runden. Nichts, was Sie hier tun, verlässt diese Seite."],"src":"Quelle für die Angaben zu Hutton: Edinburgh Geological Society.","start":"Start","next":"Weiter","again":"Noch einmal","cols":["Nr.","Zeit","Eintrag","Siegel"],"seal":"unverändert","e":["Schicht begonnen","Auftrag 1041 kommissioniert","Auftrag 1041 zugestellt","Auftrag 1042 kommissioniert","Tor 3 per Notfreigabe geöffnet","Auftrag 1042 zugestellt","Auftrag 1043 kommissioniert","Schicht beendet"],"t1":"Runde 1: Wurde etwas geändert?","q1":"Jeder Eintrag trägt ein Siegel, das beweist, dass er nach dem Schreiben nicht geändert wurde. Alle sieben Siegel sind in Ordnung. Was können Sie sagen?","a1":["Nichts wurde geändert, also ist das Protokoll vollständig.","Nichts wurde geändert, aber ich kann nicht erkennen, ob etwas fehlt.","Etwas wurde geändert."],"r1ok":"Richtig. Ein Siegel beweist, dass ein Eintrag nicht geändert wurde. Es sagt nichts über einen Eintrag, der nie geschrieben oder vor dem Versiegeln entfernt wurde.","r1no":"Nicht ganz. Alle Siegel sind in Ordnung, also wurde nichts geändert. Aber ein Siegel kann keinen Eintrag zeigen, der nicht da ist.","t2":"Runde 2: Fehlt etwas?","q2":"Jetzt hat jeder Eintrag eine laufende Nummer. Tippen Sie auf den Eintrag direkt vor der Lücke.","r2ok":"Richtig. Nummer 5 fehlt. Zwischen 10:05 und 11:10 ist also etwas geschehen, das nicht im Protokoll steht.","r2no":"Sehen Sie sich die Nummern noch einmal an. Eine wird übersprungen.","twist":"Aber beachten Sie, wer die Nummern schreibt: das System des Betreibers selbst. Wird der fehlende Eintrag entfernt und der Rest von 1 bis 7 neu nummeriert, sehen die Nummern tadellos aus.","t3":"Runde 3: Fragen Sie einen Zeugen","q3":"Das Protokoll des Betreibers ist jetzt sauber von 1 bis 7 nummeriert. Ein unabhängiger Zeuge, den der Betreiber nicht kontrolliert, hat nur zu jeder vollen Stunde die laufende Zahl der Einträge festgehalten. In welcher Stunde fehlt ein Eintrag?","wit":"Zählung des Zeugen","w":["Bis 10:00: 2 Einträge","Bis 11:00: 5 Einträge","Bis 12:00: 8 Einträge"],"a3":["09:00 bis 10:00","10:00 bis 11:00","11:00 bis 12:00","Es fehlt nichts"],"r3ok":"Richtig. Der Zeuge zählte zwischen 10:00 und 11:00 drei Einträge. Das Protokoll zeigt zwei. Der Zeuge sah nie den Inhalt, nur die Anzahl, und doch ist die Lücke gefunden.","r3no":"Vergleichen Sie für jede Stunde die Zählung des Zeugen mit der Zahl der Protokolleinträge.","t4":"Was Sie gerade getan haben","end":["Sie haben {s} von 3 im ersten Versuch richtig beantwortet.","Unverändert ist die eine Frage. Vollständig ist eine andere. Die zweite lässt sich nur mit etwas beantworten, das der Betreiber nicht kontrolliert, und mit einem benannten Umfang: vollständig für welchen Agenten, über welchen Zeitraum.","Diese Eigenschaft nennt StS Forensics witnessed completeness (bezeugte Vollständigkeit)."],"limits":"Was diese Übung nicht zeigt: Sie ist ein Lernspielzeug mit einem erfundenen Protokoll. Sie ist kein Produkt, kein Zertifikat, kein Beweis und keine Beratung. Wird keine Lücke gefunden, beweist das nie, dass nichts fehlt. Die zugrunde liegenden Testentwürfe wurden nur selbst ausgeführt und nicht unabhängig reproduziert.","links":[["Ausführlichere Demo","https://stsforensics.github.io/completeness-demo/"],["Testentwürfe, Kommentare bis 1. Dezember 2026 (englisch)","https://doi.org/10.5281/zenodo.23857888"],["Hutton am Siccar Point (Edinburgh Geological Society, englisch)","https://edinburghgeolsoc.org/edinburghs-geology/james-hutton/"]],"foot":"StS Forensics Ltd, 2026. Apache-2.0. Kein Tracking, keine Cookies, nichts wird hochgeladen.","mt":"Maschinelle Übersetzung, noch nicht von Muttersprachlern geprüft. Maßgeblich ist die englische Fassung.","x":["VerZan Check: zeigen, dass eine Datei unverändert ist","Find the Gap: eine Übung von fünf Minuten","Ask the Record: sechs Übungen von je zwei Minuten"]},"es":{"name":"Español","prog":"Paso {n} de 5","t0":"Encuentre el hueco","intro":["En 1788 James Hutton fue en barca a Siccar Point, en la costa escocesa, con Sir James Hall y John Playfair. Allí dos conjuntos de roca se encuentran formando un ángulo. Hutton leyó la superficie que los separa como un intervalo de tiempo enorme.","La roca muestra sus huecos. Un registro no.","Este ejercicio dura unos cinco minutos. Va a revisar el registro de actividad de un agente de reparto de un almacén. Tres rondas. Nada de lo que haga aquí sale de esta página."],"src":"Fuente de los datos sobre Hutton: Edinburgh Geological Society.","start":"Empezar","next":"Siguiente","again":"Jugar de nuevo","cols":["N.º","Hora","Entrada","Sello"],"seal":"sin cambios","e":["Inicio del turno","Pedido 1041 recogido","Pedido 1041 entregado","Pedido 1042 recogido","Puerta 3 abierta por anulación manual","Pedido 1042 entregado","Pedido 1043 recogido","Fin del turno"],"t1":"Ronda 1: ¿se cambió algo?","q1":"Cada entrada lleva un sello que prueba que no se alteró después de escribirse. Los siete sellos son correctos. ¿Qué puede afirmar?","a1":["No se cambió nada, así que el registro está completo.","No se cambió nada, pero no puedo saber si falta algo.","Se cambió algo."],"r1ok":"Correcto. Un sello prueba que una entrada no se alteró. No dice nada de una entrada que nunca se escribió o que se quitó antes de sellar.","r1no":"No del todo. Todos los sellos son correctos, así que no se cambió nada. Pero un sello no puede mostrar una entrada que no está.","t2":"Ronda 2: ¿falta algo?","q2":"Ahora cada entrada tiene un número correlativo. Toque la entrada que va justo antes del hueco.","r2ok":"Correcto. Falta el número 5, así que entre las 10:05 y las 11:10 ocurrió algo que no está en el registro.","r2no":"Mire otra vez los números. Se salta uno.","twist":"Pero fíjese en quién escribe los números: el propio sistema del operador. Si se quita la entrada que falta y el resto se renumera del 1 al 7, los números parecen perfectos.","t3":"Ronda 3: pregunte a un testigo","q3":"El registro del operador está ahora numerado limpiamente del 1 al 7. Un testigo independiente, que el operador no controla, solo anotó el recuento acumulado de entradas a cada hora. ¿En qué hora falta una entrada?","wit":"Recuento del testigo","w":["Hasta las 10:00: 2 entradas","Hasta las 11:00: 5 entradas","Hasta las 12:00: 8 entradas"],"a3":["De 09:00 a 10:00","De 10:00 a 11:00","De 11:00 a 12:00","No falta nada"],"r3ok":"Correcto. El testigo contó tres entradas entre las 10:00 y las 11:00. El registro muestra dos. El testigo nunca vio el contenido, solo el recuento, y aun así el hueco aparece.","r3no":"Compare, hora por hora, el recuento del testigo con el número de entradas del registro.","t4":"Lo que acaba de hacer","end":["Ha acertado {s} de 3 a la primera.","Inalterado es una pregunta. Completo es otra. Para responder a la segunda hace falta algo que el operador no controle y un alcance declarado: completo para qué agente y durante qué periodo.","A esa propiedad StS Forensics la llama witnessed completeness (completitud atestiguada)."],"limits":"Lo que este ejercicio no demuestra: es un juguete didáctico con un registro inventado. No es un producto, un certificado, una prueba ni asesoramiento. No encontrar un hueco nunca demuestra que no falte nada. Los borradores de pruebas en que se basa solo se han ejecutado internamente y nadie los ha reproducido de forma independiente.","links":[["Demostración más larga","https://stsforensics.github.io/completeness-demo/"],["Borradores de pruebas, abiertos a comentarios hasta el 1 de diciembre de 2026 (en inglés)","https://doi.org/10.5281/zenodo.23857888"],["Hutton en Siccar Point (Edinburgh Geological Society, en inglés)","https://edinburghgeolsoc.org/edinburghs-geology/james-hutton/"]],"foot":"StS Forensics Ltd, 2026. Apache-2.0. Sin rastreo, sin cookies, no se sube nada.","mt":"Traducción automática, aún no revisada por una persona nativa. La versión inglesa es la de referencia.","x":["VerZan Check: demuestre que un archivo no ha cambiado","Find the Gap: un ejercicio de cinco minutos","Ask the Record: seis ejercicios de dos minutos"]},"fr":{"name":"Français","prog":"Étape {n} sur 5","t0":"Trouvez le trou","intro":["En 1788, James Hutton se rendit en bateau à Siccar Point, sur la côte écossaise, avec Sir James Hall et John Playfair. Deux ensembles de roches s'y rencontrent en formant un angle. Hutton lut la surface qui les sépare comme un immense intervalle de temps.","La roche montre ses lacunes. Un journal, non.","Cet exercice prend environ cinq minutes. Vous vérifiez le journal d'activité d'un agent de livraison dans un entrepôt. Trois manches. Rien de ce que vous faites ici ne quitte cette page."],"src":"Source des faits sur Hutton : Edinburgh Geological Society.","start":"Commencer","next":"Suivant","again":"Rejouer","cols":["N°","Heure","Entrée","Sceau"],"seal":"inchangé","e":["Début du poste","Commande 1041 préparée","Commande 1041 livrée","Commande 1042 préparée","Porte 3 ouverte par dérogation","Commande 1042 livrée","Commande 1043 préparée","Fin du poste"],"t1":"Manche 1 : quelque chose a-t-il été modifié ?","q1":"Chaque entrée porte un sceau qui prouve qu'elle n'a pas été modifiée après son écriture. Les sept sceaux sont valides. Que pouvez-vous affirmer ?","a1":["Rien n'a été modifié, donc le journal est complet.","Rien n'a été modifié, mais je ne peux pas savoir s'il manque quelque chose.","Quelque chose a été modifié."],"r1ok":"Exact. Un sceau prouve qu'une entrée n'a pas été modifiée. Il ne dit rien d'une entrée jamais écrite, ou retirée avant le scellement.","r1no":"Pas tout à fait. Tous les sceaux sont valides, donc rien n'a été modifié. Mais un sceau ne peut pas montrer une entrée qui n'est pas là.","t2":"Manche 2 : manque-t-il quelque chose ?","q2":"Chaque entrée porte maintenant un numéro d'ordre. Touchez l'entrée qui précède juste le trou.","r2ok":"Exact. Le numéro 5 manque : il s'est donc passé quelque chose entre 10 h 05 et 11 h 10 qui n'est pas dans le journal.","r2no":"Regardez encore les numéros. L'un d'eux est sauté.","twist":"Mais notez qui écrit les numéros : le système de l'opérateur lui-même. Si l'entrée manquante est retirée et le reste renuméroté de 1 à 7, les numéros paraissent parfaits.","t3":"Manche 3 : interrogez un témoin","q3":"Le journal de l'opérateur est maintenant proprement numéroté de 1 à 7. Un témoin distinct, que l'opérateur ne contrôle pas, n'a gardé qu'un décompte cumulé des entrées à chaque heure. Dans quelle heure manque-t-il une entrée ?","wit":"Décompte du témoin","w":["À 10 h 00 : 2 entrées","À 11 h 00 : 5 entrées","À 12 h 00 : 8 entrées"],"a3":["De 9 h à 10 h","De 10 h à 11 h","De 11 h à 12 h","Il ne manque rien"],"r3ok":"Exact. Le témoin a compté trois entrées entre 10 h et 11 h. Le journal en montre deux. Le témoin n'a jamais vu le contenu, seulement le décompte, et pourtant le trou est trouvé.","r3no":"Comparez, heure par heure, le décompte du témoin au nombre d'entrées du journal.","t4":"Ce que vous venez de faire","end":["Vous avez obtenu {s} sur 3 du premier coup.","Inchangé est une question. Complet en est une autre. Répondre à la seconde exige quelque chose que l'opérateur ne contrôle pas, et un périmètre déclaré : complet pour quel agent, sur quelle période.","Cette propriété, StS Forensics l'appelle witnessed completeness (complétude attestée par un témoin)."],"limits":"Ce que cet exercice ne montre pas : c'est un jouet pédagogique avec un journal inventé. Ce n'est ni un produit, ni un certificat, ni une preuve, ni un conseil. Ne trouver aucun trou ne prouve jamais que rien ne manque. Les projets de tests sur lesquels il repose n'ont été exécutés qu'en interne et n'ont pas été reproduits de façon indépendante.","links":[["Démonstration plus longue","https://stsforensics.github.io/completeness-demo/"],["Projets de tests, ouverts aux commentaires jusqu'au 1er décembre 2026 (en anglais)","https://doi.org/10.5281/zenodo.23857888"],["Hutton à Siccar Point (Edinburgh Geological Society, en anglais)","https://edinburghgeolsoc.org/edinburghs-geology/james-hutton/"]],"foot":"StS Forensics Ltd, 2026. Apache-2.0. Aucun suivi, aucun cookie, rien n'est téléversé.","mt":"Traduction automatique, pas encore relue par une personne de langue maternelle. La version anglaise fait foi.","x":["VerZan Check : montrer qu'un fichier n'a pas changé","Find the Gap : un exercice de cinq minutes","Ask the Record : six exercices de deux minutes"]},"ja":{"name":"日本語","prog":"ステップ {n} / 5","t0":"欠落を見つける","intro":["1788年、ジェームズ・ハットンはサー・ジェームズ・ホール、ジョン・プレイフェアとともに、船でスコットランド沿岸のシッカー・ポイントを訪れました。そこでは二組の地層が角度をなして接しています。ハットンはその境界面を、途方もなく長い時間の隔たりとして読み取りました。","岩は自らの欠落を見せます。ログは見せません。","この演習は約5分です。倉庫の配送エージェントの活動ログを確認します。全3ラウンド。ここでの操作がこのページの外に送られることはありません。"],"src":"ハットンに関する事実の出典：Edinburgh Geological Society。","start":"始める","next":"次へ","again":"もう一度","cols":["番号","時刻","記録","封印"],"seal":"変更なし","e":["シフト開始","注文1041をピッキング","注文1041を配達","注文1042をピッキング","3番ドアを手動解除で開扉","注文1042を配達","注文1043をピッキング","シフト終了"],"t1":"ラウンド1：何か変更されましたか","q1":"各記録には、書き込み後に改変されていないことを証明する封印が付いています。7つの封印はすべて正常です。何が言えるでしょうか。","a1":["何も変更されていないので、ログは完全です。","何も変更されていませんが、何かが欠けているかどうかは分かりません。","何かが変更されました。"],"r1ok":"そのとおりです。封印は、記録が改変されていないことを証明します。書かれなかった記録や、封印の前に取り除かれた記録については何も語りません。","r1no":"少し違います。封印はすべて正常なので、何も変更されていません。しかし封印は、そこにない記録を示すことはできません。","t2":"ラウンド2：何か欠けていますか","q2":"今度は各記録に通し番号があります。欠落の直前の記録をタップしてください。","r2ok":"そのとおりです。5番がありません。10:05から11:10の間に、ログにない何かが起きています。","r2no":"番号をもう一度見てください。一つ飛んでいます。","twist":"ただし、番号を書いているのは誰でしょうか。運用者自身のシステムです。欠けた記録を取り除き、残りを1から7に振り直せば、番号は完璧に見えます。","t3":"ラウンド3：証人に尋ねる","q3":"運用者のログは、1から7まできれいに番号が振られています。運用者の支配下にない別の証人が、毎時の記録件数の累計だけを控えていました。記録が欠けているのはどの時間帯でしょうか。","wit":"証人の件数","w":["10:00まで：2件","11:00まで：5件","12:00まで：8件"],"a3":["09:00から10:00","10:00から11:00","11:00から12:00","何も欠けていない"],"r3ok":"そのとおりです。証人は10:00から11:00の間に3件を数えました。ログには2件しかありません。証人は内容を見ておらず、件数だけを見ていましたが、それでも欠落が見つかります。","r3no":"時間帯ごとに、証人の件数とログの記録数を比べてください。","t4":"いま行ったこと","end":["最初の回答で3問中{s}問正解でした。","改変されていないかは一つの問いです。完全かどうかは別の問いです。後者に答えるには、運用者の支配下にないものと、対象範囲の明示（どのエージェントの、どの期間について完全か）が必要です。","StS Forensics はこの性質を witnessed completeness（証人付きの完全性）と呼んでいます。"],"limits":"この演習が示さないこと：これは架空のログを使った学習用の教材です。製品、証明書、証拠、助言のいずれでもありません。欠落が見つからないことは、何も欠けていないことの証明にはなりません。もとになっている試験案は自己実施のみで、第三者による再現はまだ行われていません。","links":[["より詳しいデモ","https://stsforensics.github.io/completeness-demo/"],["試験案（2026年12月1日まで意見募集中、英語）","https://doi.org/10.5281/zenodo.23857888"],["シッカー・ポイントのハットン（Edinburgh Geological Society、英語）","https://edinburghgeolsoc.org/edinburghs-geology/james-hutton/"]],"foot":"StS Forensics Ltd、2026年。Apache-2.0。追跡なし、Cookieなし、アップロードなし。","mt":"機械翻訳です。母語話者による確認はまだ行われていません。英語版が正本です。","x":["VerZan Check：ファイルが変わっていないことを示す","Find the Gap：5分の演習","Ask the Record：2分の演習が6つ"]},"zh-HK":{"name":"繁體中文（香港）","prog":"第 {n} 步，共 5 步","t0":"找出缺口","intro":["1788年，James Hutton 與 Sir James Hall 和 John Playfair 乘船前往蘇格蘭海岸的 Siccar Point。那裏有兩組岩層以一個角度相接。Hutton 把兩者之間的那個面，看成一段極其漫長的時間。","岩石會顯示自己的缺口。日誌不會。","這個練習約需五分鐘。你要查核一個貨倉送貨代理的活動日誌。共三回合。你在這裏所做的一切都不會離開本頁。"],"src":"有關 Hutton 的資料來源：Edinburgh Geological Society。","start":"開始","next":"下一步","again":"再玩一次","cols":["編號","時間","紀錄","封印"],"seal":"未改動","e":["開始當值","執取訂單 1041","送達訂單 1041","執取訂單 1042","3 號門以越權方式開啟","送達訂單 1042","執取訂單 1043","當值結束"],"t1":"第一回合：有沒有東西被改動？","q1":"每項紀錄都有一個封印，證明它寫入後沒有被改動。七個封印全部核對無誤。你可以說甚麼？","a1":["沒有東西被改動，所以日誌是完整的。","沒有東西被改動，但我無法知道有沒有遺漏。","有東西被改動了。"],"r1ok":"對。封印證明一項紀錄沒有被改動。對於從未寫下的紀錄，或在加封前已被移除的紀錄，它甚麼也說明不了。","r1no":"不太對。封印全部無誤，所以沒有東西被改動。但封印無法顯示一項不存在的紀錄。","t2":"第二回合：有沒有遺漏？","q2":"現在每項紀錄都有流水編號。請點選缺口之前的那一項紀錄。","r2ok":"對。5 號不見了，即是 10:05 至 11:10 之間發生過一些沒有記入日誌的事。","r2no":"再看看編號。有一個被跳過了。","twist":"但請留意編號是誰寫的：營運者自己的系統。如果把缺少的紀錄移除，再把其餘的重新編為 1 至 7，編號看起來便完美無缺。","t3":"第三回合：問一問見證者","q3":"營運者的日誌現在整齊地編為 1 至 7。另有一個不受營運者控制的見證者，只記下每個整點的累計紀錄數目。哪一個小時少了一項紀錄？","wit":"見證者的數目","w":["截至 10:00：2 項","截至 11:00：5 項","截至 12:00：8 項"],"a3":["09:00 至 10:00","10:00 至 11:00","11:00 至 12:00","沒有遺漏"],"r3ok":"對。見證者在 10:00 至 11
