var D={"en":{"home":"Ask the Record","intro":"Whoever you are, there is one question to ask of an AI agent's record. Pick the seat you sit in. Each exercise takes about two minutes. Nothing you do here leaves this page.","pick":"I am","back":"Choose another seat","next":"Next","yourq":"Your question to ask","src":"Where this comes from","limits":"These are teaching exercises. The cases are invented unless a source is named. They are not a product, a certificate, evidence or advice. Finding no gap never proves that nothing is missing. The draft tests behind them are self-run and have not been independently reproduced.","more":[["Longer demo","https://stsforensics.github.io/completeness-demo/"],["Draft tests, open for comment until 1 December 2026","https://doi.org/10.5281/zenodo.23857888"]],"foot":"StS Forensics Ltd, 2026. Apache-2.0. No tracking, no cookies, nothing uploaded.","A":[{"id":"user","name":"A user","ask":"Can I see what it did for me?","steps":[{"t":"A real case. In 2022 a traveller asked an airline's website chatbot about bereavement fares and kept a screenshot of its answer. The answer was wrong. In February 2024 a tribunal in British Columbia held the airline responsible for what its chatbot said.","q":"What let him show what the chatbot had told him?","a":["The airline's own records","His own screenshot, kept at the time","A complaint posted online"],"r":1,"ok":"Yes. The tribunal's decision records that he included a screenshot of the chatbot's response. He held his own copy.","no":"The decision points to something he kept himself."},{"t":"Now picture an AI agent that acts for you: it books, cancels and pays. You cannot screenshot actions you never see.","q":"What should you be able to get?","a":["The agent's own summary","A list of every action it took, with times, and a way to check that the list is whole","A star rating"],"r":1,"ok":"Yes. A screenshot worked for one answer. For actions you need the list, and some way to know nothing is missing from it.","no":"That is the agent describing itself."}],"src":[["Moffatt v. Air Canada, 2024 BCCRT 149, Civil Resolution Tribunal of British Columbia, 14 February 2024 (paragraph 15 mentions the screenshot)","https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do"]]},{"id":"company","name":"A company that uses AI agents","ask":"Could you show someone outside that the record is whole?","steps":[{"t":"A customer says your AI assistant caused them a loss. Their lawyer asks for the records. You can prove that no entry was altered after it was written.","q":"Is that enough?","a":["Yes: unaltered means reliable","No: the next question is whether this is the whole record","Yes, if the log is long enough"],"r":1,"ok":"Right. Unaltered and complete are two different questions, and the second is the one an opponent will ask.","no":"A record can be unaltered and still be missing entries."},{"t":"You are asked to show the record is whole.","q":"What would let you show that to an outsider?","a":["A statement from your own IT team","A count or checkpoint lodged at the time with someone you do not control","A larger log file"],"r":1,"ok":"Yes. Your own word about your own record is the weak case. Something lodged with another party at the time is the strong one.","no":"That is still you vouching for yourself."}],"src":[["EU Product Liability Directive 2024/2853: software counts as a product (Article 4); Article 10(2)(a) provides for a presumption of defectiveness where a defendant fails to disclose relevant evidence under Article 9(1)","https://eur-lex.europa.eu/eli/dir/2024/2853/oj"]]},{"id":"engineer","name":"An engineer","ask":"What tells you an entry is missing, not only that one was changed?","steps":[{"t":"Your agent log is a hash chain: each record carries the hash of the one before.","q":"Which of these does the chain alone NOT catch?","a":["An edit to a record in the middle","A record removed from the middle","The last few records dropped before anyone anchored the chain"],"r":2,"ok":"Right. A chain shows edits and holes in the middle. A missing tail looks like a shorter, perfectly valid chain.","no":"The chain catches that one: the hashes stop matching."},{"t":"Worse case: the agent made a call and never wrote a record at all.","q":"What can detect that?","a":["A stronger hash","A signature on every record","A second observer, such as the receiving service, keeping its own count"],"r":2,"ok":"Yes. Nothing inside the record can show what was never recorded. Only someone else who saw the call can.","no":"That protects what was written. The problem is what was not."}],"src":[["Di Ma and Gene Tsudik, A New Approach to Secure Logging (2008, open access): names the truncation attack, where records are deleted from the end of a log, and says earlier schemes did not defend against it","https://eprint.iacr.org/2008/185"]]},{"id":"regulator","name":"A regulator or policy maker","ask":"What does the record cover, and who outside can check it?","steps":[{"t":"An operator reports: agent logs retained for 180 days, integrity verified.","q":"What do you still not know?","a":["Nothing: that is a full answer","What the record covers, and whether anyone outside the operator can check it","Only the file format"],"r":1,"ok":"Right. Retention and integrity say how the record is kept. Scope and outside checking say whether it can be relied on.","no":"Two things are missing from that report."},{"t":"An auditor was not given access to the agent logs. The audit report lists no findings on them.","q":"How should that be read?","a":["As a pass","As a limit on the audit, not as evidence that all is well","As proof of a breach"],"r":1,"ok":"Yes. India's CERT-In puts it in one line: absence of access is not evidence of conformity.","no":"No access means no finding either way."}],"src":[["CERT-In AI Security Auditing Guidelines, 4 November 2026, sections 4.7 and 7.9","https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf"],["UK factsheet of 3 November 2026: the government will consult on evidence preservation after agentic AI incidents","https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures"]]},{"id":"insurer","name":"An insurer, reinsurer or broker","ask":"Before you pay or price: is this the whole record, and who says so?","steps":[{"t":"In London market messaging, a group of messages carries a group reference and a count, so the receiver can check that the group is complete and reject it if not.","q":"An AI agent took 40 steps on a claim. Is there an equivalent check for its steps?","a":["Yes, the same count covers it","Not unless a count of the agent's steps was lodged with someone at the time","It is not needed for AI"],"r":1,"ok":"Right. The market already checks completeness for messages. Nobody yet does it for what the agent did around them.","no":"The message count covers messages, not the agent's own activity."},{"t":"A count of the agent's steps is to be kept.","q":"Who should hold it?","a":["The party that ran the agent","Someone other than the party that ran the agent","Nobody: it can be rebuilt later"],"r":1,"ok":"Yes. A count held only by the operator is the operator marking its own homework.","no":"That leaves the operator vouching for itself."}],"src":[["ACORD GRLC FAQ on grouping, group reference and message count","https://www.acord.org/standards-architecture/acord-data-standards/Global_Reinsurance_Data_Standards/grlc-faqs"]]},{"id":"auditor","name":"An auditor","ask":"What did you compare the log against?","steps":[{"t":"You are auditing a coverholder. The common audit scope now includes cyber and artificial intelligence risks. The coverholder shows an AI policy and says its agent logs are kept.","q":"What evidence would you ask for?","a":["A copy of the AI policy","A sample day: the agent's log count set beside a count kept by someone else","A screenshot of the dashboard"],"r":1,"ok":"Right. A policy says what should happen. A comparison shows what did.","no":"That shows intent, not what happened."},{"t":"No one else kept a count. There is only the coverholder's own log.","q":"What goes in your report?","a":["Pass","A scope limitation: the record could not be shown to be complete","Fail"],"r":1,"ok":"Yes. You cannot say it is complete and you cannot say it is not. Say that.","no":"You do not have the evidence for that verdict."}],"src":[["Lloyd's Market Association bulletin LMA25-029-DG: coverholder audit scope updated on 22 October 2025 to reflect cyber and artificial intelligence risks","https://lmalloyds.com/coverholder-audit-scope-and-associated-guidance/"]]}],"win":"You got there.","mt":"","name":"English","x":["VerZan Check: show that a file has not changed","Find the Gap: a five-minute exercise","Ask the Record: six two-minute exercises"]},"de":{"name":"Deutsch","home":"Die Aufzeichnung befragen","intro":"Wer auch immer Sie sind: Es gibt eine Frage, die Sie an die Aufzeichnung eines KI-Agenten stellen sollten. Wählen Sie Ihren Platz. Jede Übung dauert etwa zwei Minuten. Nichts, was Sie hier tun, verlässt diese Seite.","pick":"Ich bin","back":"Anderen Platz wählen","next":"Weiter","yourq":"Ihre Frage","src":"Quelle","win":"Geschafft.","limits":"Dies sind Lernübungen. Die Fälle sind erfunden, sofern keine Quelle genannt ist. Sie sind kein Produkt, kein Zertifikat, kein Beweis und keine Beratung. Wird keine Lücke gefunden, beweist das nie, dass nichts fehlt. Die zugrunde liegenden Testentwürfe wurden nur selbst ausgeführt und nicht unabhängig reproduziert.","foot":"StS Forensics Ltd, 2026. Apache-2.0. Kein Tracking, keine Cookies, nichts wird hochgeladen.","mt":"Maschinelle Übersetzung, noch nicht von einer Muttersprachlerin oder einem Muttersprachler geprüft. Maßgeblich ist die englische Fassung.","more":[["Ausführlichere Demo","https://stsforensics.github.io/completeness-demo/"],["Testentwürfe, Kommentare bis 1. Dezember 2026 (englisch)","https://doi.org/10.5281/zenodo.23857888"]],"A":[{"id":"user","name":"Nutzerin oder Nutzer","ask":"Kann ich sehen, was er für mich getan hat?","steps":[{"t":"Ein echter Fall. 2022 fragte ein Reisender den Chatbot auf der Website einer Fluggesellschaft nach Trauerfalltarifen und speicherte einen Screenshot der Antwort. Die Antwort war falsch. Im Februar 2024 entschied ein Tribunal in British Columbia, dass die Fluggesellschaft für die Aussagen ihres Chatbots verantwortlich ist.","q":"Womit konnte er zeigen, was der Chatbot ihm gesagt hatte?","a":["Mit den Aufzeichnungen der Fluggesellschaft","Mit seinem eigenen Screenshot, den er damals gespeichert hatte","Mit einer Beschwerde im Internet"],"r":1,"ok":"Ja. In der Entscheidung steht, dass er einen Screenshot der Chatbot-Antwort vorlegte. Er hatte seine eigene Kopie.","no":"Die Entscheidung verweist auf etwas, das er selbst aufbewahrt hatte."},{"t":"Stellen Sie sich nun einen KI-Agenten vor, der für Sie handelt: Er bucht, kündigt und bezahlt. Von Handlungen, die Sie nie sehen, können Sie keinen Screenshot machen.","q":"Was sollten Sie bekommen können?","a":["Die eigene Zusammenfassung des Agenten","Eine Liste aller Handlungen mit Uhrzeiten und eine Möglichkeit zu prüfen, ob die Liste vollständig ist","Eine Sternebewertung"],"r":1,"ok":"Ja. Für eine einzelne Antwort reichte ein Screenshot. Für Handlungen brauchen Sie die Liste und einen Weg zu erkennen, dass nichts fehlt.","no":"Damit beschreibt der Agent nur sich selbst."}],"src":[["Moffatt v. Air Canada, 2024 BCCRT 149, Civil Resolution Tribunal of British Columbia, 14. Februar 2024 (Absatz 15 erwähnt den Screenshot; englisch)","https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do"]]},{"id":"company","name":"Ein Unternehmen, das KI-Agenten einsetzt","ask":"Könnten Sie jemandem von außen zeigen, dass die Aufzeichnung vollständig ist?","steps":[{"t":"Ein Kunde sagt, Ihr KI-Assistent habe ihm einen Schaden verursacht. Sein Anwalt verlangt die Aufzeichnungen. Sie können beweisen, dass kein Eintrag nachträglich geändert wurde.","q":"Reicht das?","a":["Ja: unverändert heißt verlässlich","Nein: Die nächste Frage lautet, ob das die ganze Aufzeichnung ist","Ja, wenn das Protokoll lang genug ist"],"r":1,"ok":"Richtig. Unverändert und vollständig sind zwei verschiedene Fragen, und die zweite wird die Gegenseite stellen.","no":"Eine Aufzeichnung kann unverändert sein und trotzdem lückenhaft."},{"t":"Sie sollen zeigen, dass die Aufzeichnung vollständig ist.","q":"Womit könnten Sie das einem Außenstehenden zeigen?","a":["Mit einer Erklärung Ihrer eigenen IT-Abteilung","Mit einer Zählung oder einem Prüfpunkt, der damals bei jemandem hinterlegt wurde, den Sie nicht kontrollieren","Mit einer größeren Protokolldatei"],"r":1,"ok":"Ja. Ihr eigenes Wort über Ihre eigene Aufzeichnung ist die schwache Position. Etwas, das damals bei einer anderen Partei hinterlegt wurde, ist die starke.","no":"Damit bürgen Sie immer noch für sich selbst."}],"src":[["EU-Produkthaftungsrichtlinie 2024/2853: Software gilt als Produkt (Artikel 4); Artikel 10 Absatz 2 Buchstabe a sieht eine Vermutung der Fehlerhaftigkeit vor, wenn ein Beklagter relevante Beweismittel nach Artikel 9 Absatz 1 nicht offenlegt","https://eur-lex.europa.eu/eli/dir/2024/2853/oj"]]},{"id":"engineer","name":"Ingenieurin oder Ingenieur","ask":"Woran erkennen Sie, dass ein Eintrag fehlt, und nicht nur, dass einer geändert wurde?","steps":[{"t":"Ihr Agentenprotokoll ist eine Hash-Kette: Jeder Eintrag enthält den Hash des vorherigen.","q":"Was erkennt die Kette allein NICHT?","a":["Eine Änderung an einem Eintrag in der Mitte","Einen aus der Mitte entfernten Eintrag","Die letzten Einträge, die entfernt wurden, bevor jemand die Kette verankert hat"],"r":2,"ok":"Richtig. Eine Kette zeigt Änderungen und Lücken in der Mitte. Ein fehlendes Ende sieht aus wie eine kürzere, völlig gültige Kette.","no":"Das erkennt die Kette: Die Hashes passen nicht mehr zusammen."},{"t":"Schlimmerer Fall: Der Agent hat einen Aufruf gemacht und nie einen Eintrag geschrieben.","q":"Was kann das erkennen?","a":["Ein stärkerer Hash","Eine Signatur auf jedem Eintrag","Ein zweiter Beobachter, etwa der empfangende Dienst, der selbst mitzählt"],"r":2,"ok":"Ja. Nichts innerhalb der Aufzeichnung kann zeigen, was nie aufgezeichnet wurde. Das kann nur jemand anderes, der den Aufruf gesehen hat.","no":"Das schützt, was geschrieben wurde. Das Problem ist, was nicht geschrieben wurde."}],"src":[["Di Ma und Gene Tsudik, A New Approach to Secure Logging (2008, frei zugänglich, englisch): beschreibt den Truncation-Angriff, bei dem Einträge am Ende eines Protokolls gelöscht werden","https://eprint.iacr.org/2008/185"]]},{"id":"regulator","name":"Aufsicht oder Politik","ask":"Was deckt die Aufzeichnung ab, und wer von außen kann sie prüfen?","steps":[{"t":"Ein Betreiber meldet: Agentenprotokolle 180 Tage aufbewahrt, Integrität geprüft.","q":"Was wissen Sie immer noch nicht?","a":["Nichts: Das ist eine vollständige Antwort","Was die Aufzeichnung abdeckt und ob jemand außerhalb des Betreibers sie prüfen kann","Nur das Dateiformat"],"r":1,"ok":"Richtig. Aufbewahrung und Integrität sagen, wie die Aufzeichnung geführt wird. Umfang und Prüfung von außen sagen, ob man sich auf sie verlassen kann.","no":"In dieser Meldung fehlen zwei Dinge."},{"t":"Eine Prüferin erhielt keinen Zugang zu den Agentenprotokollen. Der Prüfbericht nennt dazu keine Feststellungen.","q":"Wie ist das zu lesen?","a":["Als bestanden","Als Grenze der Prüfung, nicht als Beleg, dass alles in Ordnung ist","Als Beweis für einen Verstoß"],"r":1,"ok":"Ja. Indiens CERT-In fasst es in einem Satz: Fehlender Zugang ist kein Beleg für Konformität.","no":"Kein Zugang bedeutet keine Feststellung, weder in die eine noch in die andere Richtung."}],"src":[["CERT-In, Leitlinien zur KI-Sicherheitsprüfung, 4. November 2026, Abschnitte 4.7 und 7.9 (englisch)","https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf"],["Britisches Merkblatt vom 3. November 2026: Die Regierung will zur Beweissicherung nach Vorfällen mit agentischer KI konsultieren (englisch)","https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures"]]},{"id":"insurer","name":"Versicherer, Rückversicherer oder Makler","ask":"Vor dem Zahlen oder Bepreisen: Ist das die ganze Aufzeichnung, und wer sagt das?","steps":[{"t":"Im Nachrichtenverkehr des Londoner Marktes trägt eine Gruppe von Nachrichten eine Gruppenreferenz und eine Anzahl. So kann der Empfänger prüfen, ob die Gruppe vollständig ist, und sie andernfalls zurückweisen.","q":"Ein KI-Agent hat bei einem Schadenfall 40 Schritte ausgeführt. Gibt es eine entsprechende Prüfung für seine Schritte?","a":["Ja, dieselbe Zählung deckt das ab","Nur wenn damals eine Zählung der Schritte des Agenten bei jemandem hinterlegt wurde","Für KI ist das nicht nötig"],"r":1,"ok":"Richtig. Der Markt prüft die Vollständigkeit von Nachrichten bereits. Für das, was der Agent darum herum getan hat, tut es noch niemand.","no":"Die Nachrichtenzählung deckt Nachrichten ab, nicht die eigene Tätigkeit des Agenten."},{"t":"Die Schritte des Agenten sollen gezählt werden.","q":"Wer sollte die Zählung führen?","a":["Die Partei, die den Agenten betrieben hat","Jemand anderes als die Partei, die den Agenten betrieben hat","Niemand: Sie lässt sich später rekonstruieren"],"r":1,"ok":"Ja. Eine Zählung, die nur der Betreiber führt, ist ein Betreiber, der seine eigene Arbeit benotet.","no":"Dann bürgt der Betreiber wieder für sich selbst."}],"src":[["ACORD GRLC FAQ zu Gruppierung, Gruppenreferenz und Nachrichtenanzahl (englisch)","https://www.acord.org/standards-architecture/acord-data-standards/Global_Reinsurance_Data_Standards/grlc-faqs"]]},{"id":"auditor","name":"Prüferin oder Prüfer","ask":"Womit haben Sie das Protokoll verglichen?","steps":[{"t":"Sie prüfen einen Coverholder. Der übliche Prüfumfang umfasst inzwischen Cyberrisiken und Risiken künstlicher Intelligenz. Der Coverholder zeigt eine KI-Richtlinie und sagt, die Agentenprotokolle würden aufbewahrt.","q":"Welchen Nachweis würden Sie verlangen?","a":["Eine Kopie der KI-Richtlinie","Einen Stichprobentag: die Zahl der Protokolleinträge des Agenten neben einer Zählung, die jemand anderes geführt hat","Einen Screenshot des Dashboards"],"r":1,"ok":"Richtig. Eine Richtlinie sagt, was geschehen soll. Ein Vergleich zeigt, was geschehen ist.","no":"Das zeigt die Absicht, nicht das Geschehene."},{"t":"Niemand sonst hat mitgezählt. Es gibt nur das eigene Protokoll des Coverholders.","q":"Was steht in Ihrem Bericht?","a":["Bestanden","Eine Einschränkung des Prüfumfangs: Die Vollständigkeit der Aufzeichnung konnte nicht gezeigt werden","Nicht bestanden"],"r":1,"ok":"Ja. Sie können nicht sagen, dass sie vollständig ist, und nicht, dass sie es nicht ist. Schreiben Sie genau das.","no":"Für dieses Urteil fehlt Ihnen der Nachweis."}],"src":[["Lloyd's Market Association, Bulletin LMA25-029-DG: Prüfumfang für Coverholder am 22. Oktober 2025 um Cyber- und KI-Risiken ergänzt (englisch)","https://lmalloyds.com/coverholder-audit-scope-and-associated-guidance/"]]}],"x":["VerZan Check: zeigen, dass eine Datei unverändert ist","Find the Gap: eine Übung von fünf Minuten","Ask the Record: sechs Übungen von je zwei Minuten"]},"es":{"name":"Español","home":"Pregunte al registro","intro":"Sea quien sea, hay una pregunta que conviene hacerle al registro de un agente de IA. Elija su asiento. Cada ejercicio dura unos dos minutos. Nada de lo que haga aquí sale de esta página.","pick":"Soy","back":"Elegir otro asiento","next":"Siguiente","yourq":"Su pregunta","src":"De dónde sale esto","win":"Lo ha conseguido.","limits":"Son ejercicios de aprendizaje. Los casos son inventados salvo que se cite una fuente. No son un producto, un certificado, una prueba ni asesoramiento. No encontrar un hueco nunca demuestra que no falte nada. Los borradores de pruebas en que se basan solo se han ejecutado internamente y nadie los ha reproducido de forma independiente.","foot":"StS Forensics Ltd, 2026. Apache-2.0. Sin rastreo, sin cookies, no se sube nada.","mt":"Traducción automática, aún no revisada por una persona nativa. La versión inglesa es la de referencia.","more":[["Demostración más larga","https://stsforensics.github.io/completeness-demo/"],["Borradores de pruebas, abiertos a comentarios hasta el 1 de diciembre de 2026 (en inglés)","https://doi.org/10.5281/zenodo.23857888"]],"A":[{"id":"user","name":"Una persona usuaria","ask":"¿Puedo ver lo que hizo por mí?","steps":[{"t":"Un caso real. En 2022 un viajero preguntó al chatbot de la web de una aerolínea por las tarifas por duelo y guardó una captura de pantalla de la respuesta. La respuesta era errónea. En febrero de 2024 un tribunal de Columbia Británica declaró a la aerolínea responsable de lo que dijo su chatbot.","q":"¿Qué le permitió demostrar lo que le había dicho el chatbot?","a":["Los registros de la propia aerolínea","Su propia captura de pantalla, guardada en su momento","Una queja publicada en internet"],"r":1,"ok":"Sí. La decisión recoge que aportó una captura de la respuesta del chatbot. Tenía su propia copia.","no":"La decisión señala algo que él mismo había guardado."},{"t":"Ahora imagine un agente de IA que actúa por usted: reserva, cancela y paga. No puede hacer capturas de acciones que nunca ve.","q":"¿Qué debería poder obtener?","a":["El resumen que hace el propio agente","Una lista de todas las acciones, con sus horas, y una forma de comprobar que la lista está completa","Una valoración con estrellas"],"r":1,"ok":"Sí. Una captura bastó para una respuesta. Para las acciones necesita la lista y alguna forma de saber que no falta nada.","no":"Eso es el agente describiéndose a sí mismo."}],"src":[["Moffatt v. Air Canada, 2024 BCCRT 149, Civil Resolution Tribunal de Columbia Británica, 14 de febrero de 2024 (el párrafo 15 menciona la captura; en inglés)","https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do"]]},{"id":"company","name":"Una empresa que usa agentes de IA","ask":"¿Podría demostrar a alguien de fuera que el registro está completo?","steps":[{"t":"Un cliente dice que su asistente de IA le causó una pérdida. Su abogado pide los registros. Usted puede probar que ninguna entrada se alteró después de escribirse.","q":"¿Es suficiente?","a":["Sí: inalterado significa fiable","No: la siguiente pregunta es si este es el registro entero","Sí, si el registro es lo bastante largo"],"r":1,"ok":"Correcto. Inalterado y completo son dos preguntas distintas, y la segunda es la que hará la parte contraria.","no":"Un registro puede estar inalterado y aun así tener entradas que faltan."},{"t":"Le piden demostrar que el registro está completo.","q":"¿Qué le permitiría demostrarlo a alguien de fuera?","a":["Una declaración de su propio equipo informático","Un recuento o punto de control depositado en su momento ante alguien que usted no controla","Un archivo de registro más grande"],"r":1,"ok":"Sí. Su propia palabra sobre su propio registro es la posición débil. Algo depositado en su momento ante un tercero es la fuerte.","no":"Eso sigue siendo usted avalándose a sí mismo."}],"src":[["Directiva (UE) 2024/2853 sobre responsabilidad por productos defectuosos: el software es un producto (artículo 4); el artículo 10, apartado 2, letra a), prevé una presunción de carácter defectuoso cuando el demandado no exhibe las pruebas pertinentes conforme al artículo 9, apartado 1","https://eur-lex.europa.eu/eli/dir/2024/2853/oj"]]},{"id":"engineer","name":"Una ingeniera o un ingeniero","ask":"¿Qué le indica que falta una entrada, y no solo que se cambió una?","steps":[{"t":"El registro de su agente es una cadena de hashes: cada entrada lleva el hash de la anterior.","q":"¿Qué es lo que la cadena por sí sola NO detecta?","a":["Una modificación en una entrada intermedia","Una entrada eliminada del medio","Las últimas entradas eliminadas antes de que nadie anclara la cadena"],"r":2,"ok":"Correcto. Una cadena muestra modificaciones y huecos en el medio. Un final que falta parece una cadena más corta y perfectamente válida.","no":"Eso sí lo detecta la cadena: los hashes dejan de coincidir."},{"t":"Un caso peor: el agente hizo una llamada y nunca escribió una entrada.","q":"¿Qué puede detectarlo?","a":["Un hash más fuerte","Una firma en cada entrada","Un segundo observador, como el servicio receptor, que lleva su propio recuento"],"r":2,"ok":"Sí. Nada dentro del registro puede mostrar lo que nunca se registró. Solo puede hacerlo otra parte que vio la llamada.","no":"Eso protege lo que se escribió. El problema es lo que no se escribió."}],"src":[["Di Ma y Gene Tsudik, A New Approach to Secure Logging (2008, acceso abierto, en inglés): describe el ataque de truncamiento, en el que se borran entradas del final de un registro","https://eprint.iacr.org/2008/185"]]},{"id":"regulator","name":"Un regulador o responsable de políticas","ask":"¿Qué cubre el registro, y quién de fuera puede comprobarlo?","steps":[{"t":"Un operador informa: registros del agente conservados 180 días, integridad verificada.","q":"¿Qué sigue sin saber?","a":["Nada: es una respuesta completa","Qué cubre el registro y si alguien ajeno al operador puede comprobarlo","Solo el formato del archivo"],"r":1,"ok":"Correcto. La conservación y la integridad dicen cómo se guarda el registro. El alcance y la comprobación externa dicen si se puede confiar en él.","no":"A ese informe le faltan dos cosas."},{"t":"A una auditora no se le dio acceso a los registros del agente. El informe de auditoría no recoge hallazgos sobre ellos.","q":"¿Cómo debe leerse?","a":["Como un aprobado","Como un límite de la auditoría, no como prueba de que todo está bien","Como prueba de un incumplimiento"],"r":1,"ok":"Sí. El CERT-In de la India lo resume en una línea: la falta de acceso no es prueba de conformidad.","no":"Sin acceso no hay hallazgo en ningún sentido."}],"src":[["CERT-In, directrices de auditoría de seguridad de IA, 4 de noviembre de 2026, secciones 4.7 y 7.9 (en inglés)","https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf"],["Ficha del Gobierno británico de 3 de noviembre de 2026: consultará sobre la conservación de pruebas tras incidentes con IA agéntica (en inglés)","https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures"]]},{"id":"insurer","name":"Una aseguradora, reaseguradora o corredor","ask":"Antes de pagar o tarificar: ¿es este el registro entero, y quién lo dice?","steps":[{"t":"En la mensajería del mercado de Londres, un grupo de mensajes lleva una referencia de grupo y un recuento, de modo que el receptor puede comprobar que el grupo está completo y rechazarlo si no lo está.","q":"Un agente de IA dio 40 pasos en un siniestro. ¿Existe una comprobación equivalente para sus pasos?","a":["Sí, el mismo recuento lo cubre","No, salvo que en su momento se depositara ante alguien un recuento de los pasos del agente","No hace falta para la IA"],"r":1,"ok":"Correcto. El mercado ya comprueba que los mensajes estén completos. Nadie lo hace todavía con lo que el agente hizo alrededor de ellos.","no":"El recuento de mensajes cubre los mensajes, no la actividad propia del agente."},{"t":"Se va a llevar un recuento de los pasos del agente.","q":"¿Quién debería guardarlo?","a":["La parte que operó el agente","Alguien distinto de la parte que operó el agente","Nadie: se puede reconstruir después"],"r":1,"ok":"Sí. Un recuento que solo guarda el operador es el operador corrigiendo su propio examen.","no":"Así el operador vuelve a avalarse a sí mismo."}],"src":[["ACORD GRLC FAQ sobre agrupación, referencia de grupo y recuento de mensajes (en inglés)","https://www.acord.org/standards-architecture/acord-data-standards/Global_Reinsurance_Data_Standards/grlc-faqs"]]},{"id":"auditor","name":"Una auditora o un auditor","ask":"¿Con qué comparó el registro?","steps":[{"t":"Está auditando a un coverholder. El alcance habitual de la auditoría incluye ahora los riesgos cibernéticos y de inteligencia artificial. El coverholder muestra una política de IA y dice que conserva los registros de sus agentes.","q":"¿Qué evidencia pediría?","a":["Una copia de la política de IA","Un día de muestra: el recuento del registro del agente junto a un recuento llevado por otra parte","Una captura del panel de control"],"r":1,"ok":"Correcto. Una política dice lo que debería ocurrir. Una comparación muestra lo que ocurrió.","no":"Eso muestra la intención, no lo que ocurrió."},{"t":"Nadie más llevó un recuento. Solo existe el registro del propio coverholder.","q":"¿Qué pone en su informe?","a":["Aprobado","Una limitación al alcance: no se pudo demostrar que el registro esté completo","Suspenso"],"r":1,"ok":"Sí. No puede decir que está completo ni que no lo está. Diga eso.","no":"No tiene evidencia para ese veredicto."}],"src":[["Lloyd's Market Association, boletín LMA25-029-DG: el alcance de la auditoría de coverholders se actualizó el 22 de octubre de 2025 para reflejar los riesgos cibernéticos y de IA (en inglés)","https://lmalloyds.com/coverholder-audit-scope-and-associated-guidance/"]]}],"x":["VerZan Check: demuestre que un archivo no ha cambiado","Find the Gap: un ejercicio de cinco minutos","Ask the Record: seis ejercicios de dos minutos"]},"fr":{"name":"Français","home":"Interrogez le registre","intro":"Qui que vous soyez, il y a une question à poser au registre d'un agent d'IA. Choisissez votre place. Chaque exercice prend environ deux minutes. Rien de ce que vous faites ici ne quitte cette page.","pick":"Je suis","back":"Choisir une autre place","next":"Suivant","yourq":"Votre question","src":"D'où cela vient","win":"Vous y êtes.","limits":"Ce sont des exercices pédagogiques. Les cas sont inventés, sauf lorsqu'une source est citée. Ce n'est ni un produit, ni un certificat, ni une preuve, ni un conseil. Ne trouver aucun trou ne prouve jamais que rien ne manque. Les projets de tests sur lesquels ils reposent n'ont été exécutés qu'en interne et n'ont pas été reproduits de façon indépendante.","foot":"StS Forensics Ltd, 2026. Apache-2.0. Aucun suivi, aucun cookie, rien n'est téléversé.","mt":"Traduction automatique, pas encore relue par une personne de langue maternelle. La version anglaise fait foi.","more":[["Démonstration plus longue","https://stsforensics.github.io/completeness-demo/"],["Projets de tests, ouverts aux commentaires jusqu'au 1er décembre 2026 (en anglais)","https://doi.org/10.5281/zenodo.23857888"]],"A":[{"id":"user","name":"Une utilisatrice ou un utilisateur","ask":"Puis-je voir ce qu'il a fait pour moi ?","steps":[{"t":"Un cas réel. En 2022, un voyageur a interrogé le chatbot du site d'une compagnie aérienne sur les tarifs de deuil et a gardé une capture d'écran de la réponse. La réponse était fausse. En février 2024, un tribunal de Colombie-Britannique a tenu la compagnie pour responsable de ce que son chatbot avait dit.","q":"Qu'est-ce qui lui a permis de montrer ce que le chatbot lui avait dit ?","a":["Les registres de la compagnie aérienne","Sa propre capture d'écran, gardée sur le moment","Une plainte publiée en ligne"],"r":1,"ok":"Oui. La décision indique qu'il a fourni une capture d'écran de la réponse du chatbot. Il avait sa propre copie.","no":"La décision renvoie à quelque chose qu'il avait gardé lui-même."},{"t":"Imaginez maintenant un agent d'IA qui agit pour vous : il réserve, résilie et paie. Vous ne pouvez pas faire de capture d'écran d'actions que vous ne voyez jamais.","q":"Que devriez-vous pouvoir obtenir ?","a":["Le résumé fait par l'agent lui-même","Une liste de toutes ses actions, avec les heures, et un moyen de vérifier que la liste est complète","Une note en étoiles"],"r":1,"ok":"Oui. Une capture d'écran a suffi pour une réponse. Pour des actions, il vous faut la liste, et un moyen de savoir qu'il n'y manque rien.","no":"C'est l'agent qui se décrit lui-même."}],"src":[["Moffatt v. Air Canada, 2024 BCCRT 149, Civil Resolution Tribunal de Colombie-Britannique, 14 février 2024 (le paragraphe 15 mentionne la capture d'écran ; en anglais)","https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do"]]},{"id":"company","name":"Une entreprise qui utilise des agents d'IA","ask":"Pourriez-vous montrer à quelqu'un d'extérieur que le registre est complet ?","steps":[{"t":"Un client affirme que votre assistant d'IA lui a causé une perte. Son avocat demande les registres. Vous pouvez prouver qu'aucune entrée n'a été modifiée après son écriture.","q":"Est-ce suffisant ?","a":["Oui : non modifié veut dire fiable","Non : la question suivante est de savoir si c'est le registre entier","Oui, si le journal est assez long"],"r":1,"ok":"Exact. Non modifié et complet sont deux questions différentes, et la seconde est celle que posera la partie adverse.","no":"Un registre peut être intact et avoir malgré tout des entrées manquantes."},{"t":"On vous demande de montrer que le registre est complet.","q":"Qu'est-ce qui vous permettrait de le montrer à quelqu'un d'extérieur ?","a":["Une déclaration de votre propre équipe informatique","Un décompte ou un point de contrôle déposé sur le moment auprès de quelqu'un que vous ne contrôlez pas","Un fichier journal plus volumineux"],"r":1,"ok":"Oui. Votre propre parole sur votre propre registre est la position faible. Quelque chose déposé sur le moment auprès d'un tiers est la position forte.","no":"C'est encore vous qui vous portez garant de vous-même."}],"src":[["Directive (UE) 2024/2853 sur la responsabilité du fait des produits défectueux : le logiciel est un produit (article 4) ; l'article 10, paragraphe 2, point a), prévoit une présomption de défectuosité lorsque le défendeur ne divulgue pas les éléments de preuve pertinents visés à l'article 9, paragraphe 1","https://eur-lex.europa.eu/eli/dir/2024/2853/oj"]]},{"id":"engineer","name":"Une ingénieure ou un ingénieur","ask":"Qu'est-ce qui vous dit qu'une entrée manque, et pas seulement qu'une entrée a été modifiée ?","steps":[{"t":"Le journal de votre agent est une chaîne de hachage : chaque entrée porte le hachage de la précédente.","q":"Qu'est-ce que la chaîne seule ne détecte PAS ?","a":["Une modification d'une entrée au milieu","Une entrée retirée du milieu","Les dernières entrées supprimées avant que quiconque ait ancré la chaîne"],"r":2,"ok":"Exact. Une chaîne révèle les modifications et les trous au milieu. Une fin manquante ressemble à une chaîne plus courte et parfaitement valide.","no":"Cela, la chaîne le détecte : les hachages ne concordent plus."},{"t":"Cas plus grave : l'agent a fait un appel et n'a jamais écrit d'entrée.","q":"Qu'est-ce qui peut le détecter ?","a":["Un hachage plus robuste","Une signature sur chaque entrée","Un second observateur, par exemple le service destinataire, qui tient son propre décompte"],"r":2,"ok":"Oui. Rien à l'intérieur du registre ne peut montrer ce qui n'a jamais été enregistré. Seul quelqu'un d'autre qui a vu l'appel le peut.","no":"Cela protège ce qui a été écrit. Le problème est ce qui ne l'a pas été."}],"src":[["Di Ma et Gene Tsudik, A New Approach to Secure Logging (2008, accès libre, en anglais) : décrit l'attaque par troncature, où des entrées sont supprimées à la fin d'un journal","https://eprint.iacr.org/2008/185"]]},{"id":"regulator","name":"Un régulateur ou un décideur public","ask":"Que couvre le registre, et qui à l'extérieur peut le vérifier ?","steps":[{"t":"Un opérateur déclare : journaux de l'agent conservés 180 jours, intégrité vérifiée.","q":"Que vous manque-t-il encore ?","a":["Rien : c'est une réponse complète","Ce que couvre le registre, et si quelqu'un d'extérieur à l'opérateur peut le vérifier","Seulement le format du fichier"],"r":1,"ok":"Exact. La conservation et l'intégrité disent comment le registre est tenu. Le périmètre et la vérification externe disent si l'on peut s'y fier.","no":"Il manque deux choses à cette déclaration."},{"t":"Une auditrice n'a pas eu accès aux journaux de l'agent. Le rapport d'audit ne mentionne aucune constatation à leur sujet.","q":"Comment faut-il le lire ?","a":["Comme une réussite","Comme une limite de l'audit, et non comme la preuve que tout va bien","Comme la preuve d'un manquement"],"r":1,"ok":"Oui. Le CERT-In indien le dit en une ligne : l'absence d'accès n'est pas une preuve de conformité.","no":"Pas d'accès, donc pas de constatation, ni dans un sens ni dans l'autre."}],"src":[["CERT-In, lignes directrices d'audit de sécurité de l'IA, 4 novembre 2026, sections 4.7 et 7.9 (en anglais)","https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf"],["Fiche du gouvernement britannique du 3 novembre 2026 : il consultera sur la conservation des preuves après des incidents d'IA agentique (en anglais)","https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures"]]},{"id":"insurer","name":"Un assureur, un réassureur ou un courtier","ask":"Avant de payer ou de tarifer : est-ce le registre entier, et qui le dit ?","steps":[{"t":"Dans la messagerie du marché de Londres, un groupe de messages porte une référence de groupe et un décompte : le destinataire peut ainsi vérifier que le groupe est complet et le rejeter sinon.","q":"Un agent d'IA a effectué 40 étapes sur un sinistre. Existe-t-il une vérification équivalente pour ses étapes ?","a":["Oui, le même décompte la couvre","Non, sauf si un décompte des étapes de l'agent a été déposé auprès de quelqu'un sur le moment","Ce n'est pas nécessaire pour l'IA"],"r":1,"ok":"Exact. Le marché vérifie déjà que les messages sont complets. Personne ne le fait encore pour ce que l'agent a fait autour d'eux.","no":"Le décompte des messages couvre les messages, pas l'activité propre de l'agent."},{"t":"Un décompte des étapes de l'agent doit être tenu.","q":"Qui devrait le détenir ?","a":["La partie qui a fait fonctionner l'agent","Quelqu'un d'autre que la partie qui a fait fonctionner l'agent","Personne : on pourra le reconstituer plus tard"],"r":1,"ok":"Oui. Un décompte détenu par le seul opérateur, c'est l'opérateur qui corrige sa propre copie.","no":"L'opérateur se porte alors garant de lui-même."}],"src":[["ACORD GRLC FAQ sur le regroupement, la référence de groupe et le décompte des messages (en anglais)","https://www.acord.org/standards-architecture/acord-data-standards/Global_Reinsurance_Data_Standards/grlc-faqs"]]},{"id":"auditor","name":"Une auditrice ou un auditeur","ask":"À quoi avez-vous comparé le journal ?","steps":[{"t":"Vous auditez un coverholder. Le périmètre d'audit habituel inclut désormais les risques cyber et d'intelligence artificielle. Le coverholder présente une politique d'IA et dit que les journaux de ses agents sont conservés.","q":"Quelle preuve demanderiez-vous ?","a":["Une copie de la politique d'IA","Une journée témoin : le décompte du journal de l'agent mis en regard d'un décompte tenu par quelqu'un d'autre","Une capture d'écran du tableau de bord"],"r":1,"ok":"Exact. Une politique dit ce qui devrait se passer. Une comparaison montre ce qui s'est passé.","no":"Cela montre l'intention, pas ce qui s'est passé."},{"t":"Personne d'autre n'a tenu de décompte. Il n'y a que le journal du coverholder lui-même.","q":"Qu'écrivez-vous dans votre rapport ?","a":["Conforme","Une limitation du périmètre : il n'a pas pu être démontré que le registre est complet","Non conforme"],"r":1,"ok":"Oui. Vous ne pouvez dire ni qu'il est complet ni qu'il ne l'est pas. Écrivez-le.","no":"Vous n'avez pas les éléments pour ce verdict."}],"src":[["Lloyd's Market Association, bulletin LMA25-029-DG : périmètre d'audit des coverholders mis à jour le 22 octobre 2025 pour refléter les risques cyber et d'IA (en anglais)","https://lmalloyds.com/coverholder-audit-scope-and-associated-guidance/"]]}],"x":["VerZan Check : montrer qu'un fichier n'a pas changé","Find the Gap : un exercice de cinq minutes","Ask the Record : six exercices de deux minutes"]},"ja":{"name":"日本語","home":"記録に問いかける","intro":"どの立場の方にも、AIエージェントの記録に対して尋ねるべき問いが一つあります。ご自分の立場を選んでください。各演習は約2分です。ここでの操作がこのページの外に送られることはありません。","pick":"私の立場","back":"別の立場を選ぶ","next":"次へ","yourq":"あなたが尋ねるべき問い","src":"出典","win":"正解にたどり着きました。","limits":"これは学習用の演習です。出典が示されていない事例は架空のものです。製品、証明書、証拠、助言のいずれでもありません。欠落が見つからないことは、何も欠けていないことの証明にはなりません。もとになっている試験案は自己実施のみで、第三者による再現はまだ行われていません。","foot":"StS Forensics Ltd、2026年。Apache-2.0。追跡なし、Cookieなし、アップロードなし。","mt":"機械翻訳です。母語話者による確認はまだ行われていません。英語版が正本です。","more":[["より詳しいデモ","https://stsforensics.github.io/completeness-demo/"],["試験案（2026年12月1日まで意見募集中、英語）","https://doi.org/10.5281/zenodo.23857888"]],"A":[{"id":"user","name":"利用者","ask":"それが私のために何をしたのか、私は見ることができますか。","steps":[{"t":"実際の事例です。2022年、ある旅行者が航空会社のウェブサイトのチャットボットに忌引き運賃について尋ね、回答のスクリーンショットを保存しました。回答は誤りでした。2024年2月、ブリティッシュコロンビア州の審判所は、チャットボットの発言について航空会社に責任があると判断しました。","q":"チャットボットが何と答えたかを、彼は何によって示せたのでしょうか。","a":["航空会社自身の記録","その時に保存しておいた自分のスクリーンショット","インターネットに投稿した苦情"],"r":1,"ok":"そのとおりです。決定には、彼がチャットボットの回答のスクリーンショットを提出したと記されています。自分の控えを持っていたのです。","no":"決定が挙げているのは、彼自身が保存していたものです。"},{"t":"次に、あなたの代わりに行動するAIエージェントを考えてください。予約し、解約し、支払います。自分が見ていない行動のスクリーンショットは撮れません。","q":"あなたは何を入手できるべきでしょうか。","a":["エージェント自身による要約","時刻付きのすべての行動の一覧と、その一覧に漏れがないことを確かめる方法","星の数による評価"],"r":1,"ok":"そのとおりです。一つの回答ならスクリーンショットで足りました。行動については一覧が必要で、さらに何も欠けていないと分かる手段が必要です。","no":"それはエージェントが自分自身を説明しているにすぎません。"}],"src":[["Moffatt v. Air Canada, 2024 BCCRT 149、ブリティッシュコロンビア州 Civil Resolution Tribunal、2024年2月14日（第15段落にスクリーンショットの記載。英語）","https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do"]]},{"id":"company","name":"AIエージェントを利用する企業","ask":"記録に欠落がないことを、社外の人に示せますか。","steps":[{"t":"顧客が、貴社のAIアシスタントのせいで損失を被ったと主張しています。相手方の弁護士が記録の提出を求めています。貴社は、どの記録も書き込み後に改変されていないことを証明できます。","q":"それで十分でしょうか。","a":["はい。改変がなければ信頼できます","いいえ。次に問われるのは、これが記録のすべてかどうかです","はい。ログが十分に長ければ"],"r":1,"ok":"そのとおりです。改変されていないことと、完全であることは別の問いです。相手方が尋ねるのは後者です。","no":"記録は改変されていなくても、項目が欠けていることがあります。"},{"t":"記録に欠落がないことを示すよう求められました。","q":"社外の人にそれを示せるものは何でしょうか。","a":["自社のIT部門による声明","その時点で、自社の支配下にない相手に預けておいた件数またはチェックポイント","より大きなログファイル"],"r":1,"ok":"そのとおりです。自社の記録についての自社の言葉は弱い立場です。その時点で他者に預けたものがあれば強い立場になります。","no":"それでは依然として自分で自分を保証しているだけです。"}],"src":[["EU製造物責任指令 2024/2853：ソフトウェアは製造物に含まれる（第4条）。被告が第9条第1項に基づく関連証拠を開示しない場合について、第10条第2項(a)は欠陥の推定を定める","https://eur-lex.europa.eu/eli/dir/2024/2853/oj"]]},{"id":"engineer","name":"エンジニア","ask":"記録が変更されたことだけでなく、記録が欠けていることを、何によって知りますか。","steps":[{"t":"エージェントのログはハッシュチェーンになっています。各レコードは直前のレコードのハッシュを持ちます。","q":"チェーンだけでは検出できないのはどれでしょうか。","a":["途中のレコードの書き換え","途中のレコードの削除","誰かがチェーンを外部に固定する前に、末尾の数件が落とされること"],"r":2,"ok":"そのとおりです。チェーンは途中の書き換えや欠落を示します。末尾が欠けたものは、短いだけの完全に有効なチェーンに見えます。","no":"それはチェーンで検出できます。ハッシュが合わなくなるからです。"},{"t":"さらに厄介な場合です。エージェントが呼び出しを行ったのに、レコードを一切書かなかったとします。","q":"何がそれを検出できるでしょうか。","a":["より強いハッシュ","すべてのレコードへの署名","受信側のサービスなど、独自に件数を数えている第二の観測者"],"r":2,"ok":"そのとおりです。記録されなかったものを、記録の内側から示すことはできません。その呼び出しを見た他者だけが示せます。","no":"それは書かれたものを守ります。問題は書かれなかったものです。"}],"src":[["Di Ma、Gene Tsudik「A New Approach to Secure Logging」（2008年、オープンアクセス、英語）：ログの末尾のレコードを削除する切り詰め攻撃を取り上げている","https://eprint.iacr.org/2008/185"]]},{"id":"regulator","name":"規制当局・政策担当者","ask":"その記録は何を対象とし、外部の誰が確認できますか。","steps":[{"t":"事業者の報告です。エージェントのログを180日間保存、完全性を検証済み。","q":"まだ分からないことは何でしょうか。","a":["何もありません。十分な回答です","記録が何を対象としているか、そして事業者以外の誰かが確認できるか","ファイル形式だけ"],"r":1,"ok":"そのとおりです。保存期間と完全性は、記録の保管方法を示します。対象範囲と外部による確認は、その記録に依拠できるかどうかを示します。","no":"その報告には二つのことが欠けています。"},{"t":"監査人はエージェントのログへのアクセスを与えられませんでした。監査報告書にはログに関する指摘事項がありません。","q":"これをどう読むべきでしょうか。","a":["合格として","問題がないことの証拠ではなく、監査の限界として","違反の証明として"],"r":1,"ok":"そのとおりです。インドのCERT-Inは一文で述べています。アクセスがないことは適合の証拠ではありません。","no":"アクセスがなければ、どちらの方向の所見も出せません。"}],"src":[["CERT-In「AIセキュリティ監査ガイドライン」2026年11月4日、4.7節および7.9節（英語）","https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf"],["英国政府の2026年11月3日付ファクトシート：エージェント型AIのインシデント後の証拠保全について意見公募を行う方針（英語）","https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures"]]},{"id":"insurer","name":"保険会社・再保険会社・ブローカー","ask":"支払いや料率設定の前に。これは記録のすべてですか。それを誰が保証しますか。","steps":[{"t":"ロンドン市場のメッセージ交換では、メッセージのグループにグループ参照番号と件数が付きます。受信者はグループが完全かどうかを確認でき、不完全なら拒否します。","q":"あるAIエージェントが一件の保険金請求で40の手順を実行しました。その手順について同等の確認はあるでしょうか。","a":["はい。同じ件数で確認できます","その時点でエージェントの手順の件数が誰かに預けられていない限り、ありません","AIには必要ありません"],"r":1,"ok":"そのとおりです。市場はすでにメッセージの完全性を確認しています。その周辺でエージェントが行ったことについては、まだ誰も確認していません。","no":"メッセージの件数が対象とするのはメッセージであり、エージェント自身の活動ではありません。"},{"t":"エージェントの手順の件数を記録することになりました。","q":"誰がそれを保持すべきでしょうか。","a":["エージェントを運用した当事者","エージェントを運用した当事者以外の誰か","誰も保持しない。後で再構成できる"],"r":1,"ok":"そのとおりです。運用者だけが持つ件数は、運用者が自分の答案を自分で採点するのと同じです。","no":"それでは運用者が自分で自分を保証することになります。"}],"src":[["ACORD GRLC FAQ：グループ化、グループ参照番号、メッセージ件数について（英語）","https://www.acord.org/standards-architecture/acord-data-standards/Global_Reinsurance_Data_Standards/grlc-faqs"]]},{"id":"auditor","name":"監査人","ask":"そのログを何と突き合わせましたか。","steps":[{"t":"あなたはカバーホルダーを監査しています。共通の監査範囲には現在、サイバーリスクと人工知能のリスクが含まれます。カバーホルダーはAI方針を示し、エージェントのログは保存していると述べています。","q":"どのような証拠を求めますか。","a":["AI方針の写し","ある一日の抽出：エージェントのログ件数と、他者が記録していた件数との突き合わせ","ダッシュボードのスクリーンショット"],"r":1,"ok":"そのとおりです。方針は、何が起きるべきかを示します。突き合わせは、何が起きたかを示します。","no":"それが示すのは意図であり、実際に起きたことではありません。"},{"t":"他には誰も件数を記録していませんでした。あるのはカバーホルダー自身のログだけです。","q":"報告書には何と書きますか。","a":["合格","範囲の制限：記録が完全であることを示せなかった","不合格"],"r":1,"ok":"そのとおりです。完全であるとも、完全でないとも言えません。そのとおりに書いてください。","no":"その判定を下すだけの証拠がありません。"}],"src":[["Lloyd's Market Association 通達 LMA25-029-DG：カバーホルダー監査範囲を2025年10月22日に改定し、サイバーおよびAIのリスクを反映（英語）","https://lmalloyds.com/coverholder-audit-scope-and-associated-guidance/"]]}],"x":["VerZan Check：ファイルが変わっていないことを示す","Find the Gap：5分の演習","Ask the Record：2分の演習が6つ"]},"zh-HK":{"name":"繁體中文（香港）","home":"向紀錄發問","intro":"無論你是誰，面對人工智能代理的紀錄，都有一條問題值得問。請選擇你的位置。每個練習約需兩分鐘。你在這裏所做的一切都不會離開本頁。","pick":"我是","back":"選擇另一個位置","next":"下一步","yourq":"你應該問的問題","src":"資料來源","win":"你答對了。","limits":"這些是教學練習。除註明來源外，案例均屬虛構。它們不是產品、證書、證據或意見。找不到缺口，並不證明沒有遺漏。背後的測試草案只由我們自行執行，尚未經第三方獨立重現。","foot":"StS Forensics Ltd，2026年。Apache-2.0。不追蹤、不使用 Cookie、不上載任何資料。","mt":"機器翻譯，尚未經母語人士審閱。以英文版為準。","more":[["較詳細的示範","https://stsforensics.github.io/completeness-demo/"],["測試草案，徵求意見至2026年12月1日（英文）","https://doi.org/10.5281/zenodo.23857888"]],"A":[{"id":"user","name":"用戶","ask":"我能看到它替我做了甚麼嗎？","steps":[{"t":"一宗真實個案。2022年，一名旅客向航空公司網站的聊天機械人查詢喪親票價，並把回覆截圖保存。該回覆是錯的。2024年2月，卑詩省一個審裁處裁定航空公司須為其聊天機械人所說的話負責。","q":"他憑甚麼證明聊天機械人對他說過甚麼？","a":["航空公司自己的紀錄","他當時自己保存的截圖","在網上發表的投訴"],"r":1,"ok":"對。裁決記載他提交了聊天機械人回覆的截圖。他手上有自己的副本。","no":"裁決提到的是他自己保存的東西。"},{"t":"現在設想一個替你辦事的人工智能代理：它會預訂、取消和付款。你從未見過的行動，你無法截圖。","q":"你應該可以取得甚麼？","a":["代理自己寫的摘要","它每一項行動連同時間的清單，以及核實清單完整的方法","星級評分"],"r":1,"ok":"對。一個回覆，有截圖已經足夠。至於行動，你需要那份清單，還要有辦法知道沒有遺漏。","no":"那只是代理在形容自己。"}],"src":[["Moffatt v. Air Canada，2024 BCCRT 149，卑詩省 Civil Resolution Tribunal，2024年2月14日（第15段提及截圖；英文）","https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do"]]},{"id":"company","name":"使用人工智能代理的公司","ask":"你能向外人證明紀錄是完整的嗎？","steps":[{"t":"一名客戶指你的人工智能助理令他蒙受損失。他的律師要求取得紀錄。你能證明沒有任何一項紀錄在寫入後被改動。","q":"這樣足夠嗎？","a":["足夠：沒有改動就是可靠","不足夠：下一條問題是，這是否全部紀錄","足夠，只要日誌夠長"],"r":1,"ok":"對。沒有改動和完整是兩條不同的問題，而對方會問的是第二條。","no":"紀錄可以沒有被改動，卻仍然缺少項目。"},{"t":"對方要求你證明紀錄完整。","q":"甚麼東西可以讓你向外人證明這一點？","a":["你自己資訊科技部門的聲明","當時已交予一個不受你控制的人保存的數目或檢查點","一個更大的日誌檔案"],"r":1,"ok":"對。你自己為自己的紀錄作保，是弱的一方。當時已交予另一方保存的東西，才是強的一方。","no":"這仍然是你自己替自己作保。"}],"src":[["歐盟產品責任指令 2024/2853：軟件屬於產品（第4條）；如被告沒有按第9(1)條披露相關證據，第10(2)(a)條訂明可推定產品有缺陷","https://eur-lex.europa.eu/eli/dir/2024/2853/oj"]]},{"id":"engineer","name":"工程師","ask":"甚麼可以告訴你有一項紀錄不見了，而不只是有一項被改過？","steps":[{"t":"你的代理日誌是一條雜湊鏈：每項紀錄都載有上一項的雜湊值。","q":"單靠這條鏈，哪一種情況是查不出來的？","a":["中間一項紀錄被修改","中間一項紀錄被移除","在任何人把鏈錨定之前，最後幾項紀錄被刪去"],"r":2,"ok":"對。雜湊鏈能顯示中間的修改和缺口。缺了尾段的鏈，看起來只是一條較短而完全有效的鏈。","no":"這一種雜湊鏈查得出：雜湊值會對不上。"},{"t":"更壞的情況：代理發出了一次呼叫，卻從來沒有寫下紀錄。","q":"甚麼可以查出這種情況？","a":["更強的雜湊算法","每項紀錄都加上簽署","第二個觀察者，例如接收呼叫的服務，自己另行點算"],"r":2,"ok":"對。紀錄之內沒有任何東西能顯示從未被記下的事。只有另一個見過那次呼叫的人才能做到。","no":"那只保護已寫下的東西。問題在於沒有寫下的東西。"}],"src":[["Di Ma 與 Gene Tsudik，A New Approach to Secure Logging（2008年，公開取用，英文）：討論截斷攻擊，即刪去日誌末段的紀錄","https://eprint.iacr.org/2008/185"]]},{"id":"regulator","name":"監管機構或政策制訂者","ask":"這份紀錄涵蓋甚麼？外面有誰可以查核？","steps":[{"t":"一名營運者報告：代理日誌保存180日，完整性已驗證。","q":"你仍然不知道甚麼？","a":["沒有：這已是完整的答案","紀錄涵蓋甚麼，以及營運者以外有沒有人可以查核","只有檔案格式"],"r":1,"ok":"對。保存期和完整性說明紀錄如何保管。涵蓋範圍和外部查核，才說明這份紀錄能否倚賴。","no":"這份報告欠了兩樣東西。"},{"t":"一名審核員未獲准查閱代理日誌。審核報告沒有就日誌列出任何發現。","q":"這應該怎樣解讀？","a":["當作合格","當作審核的局限，而不是一切妥當的證據","當作違規的證明"],"r":1,"ok":"對。印度的 CERT-In 用一句話說明：未能查閱，並不是符合要求的證據。","no":"未能查閱，就是兩方面都沒有結論。"}],"src":[["CERT-In《人工智能保安審核指引》，2026年11月4日，第4.7及7.9節（英文）","https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf"],["英國政府2026年11月3日的資料便覽：將就代理式人工智能事故後的證據保存進行諮詢（英文）","https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures"]]},{"id":"insurer","name":"保險公司、再保險公司或經紀","ask":"在賠付或定價之前：這是全部紀錄嗎？由誰來說？","steps":[{"t":"在倫敦市場的訊息交換中，一組訊息附有組別參考編號和數目，接收方因此可以核對該組是否齊全，不齊全便拒收。","q":"一個人工智能代理在一宗索償中執行了40個步驟。它的步驟有沒有同等的核對？","a":["有，同一個數目已涵蓋","沒有，除非當時已把代理步驟的數目交予某人保存","人工智能不需要"],"r":1,"ok":"對。市場已經為訊息核對是否齊全。至於代理在訊息以外所做的事，目前還沒有人這樣做。","no":"訊息數目涵蓋的是訊息，不是代理本身的活動。"},{"t":"現在要為代理的步驟保存一個數目。","q":"應該由誰持有？","a":["運行代理的一方","運行代理一方以外的人","不用任何人持有：日後可以重建"],"r":1,"ok":"對。只由營運者持有的數目，等於營運者自己批改自己的功課。","no":"這樣又是營運者替自己作保。"}],"src":[["ACORD GRLC 常見問題：分組、組別參考編號及訊息數目（英文）","https://www.acord.org/standards-architecture/acord-data-standards/Global_Reinsurance_Data_Standards/grlc-faqs"]]},{"id":"auditor","name":"審核員","ask":"你把日誌和甚麼作比對？","steps":[{"t":"你正在審核一間承保代理（coverholder）。通用的審核範圍現已包括網絡風險和人工智能風險。該公司出示一份人工智能政策，並表示代理日誌有保存。","q":"你會要求甚麼證據？","a":["人工智能政策的副本","抽查一日：把代理日誌的數目與另一方所保存的數目並排比對","儀表板的截圖"],"r":1,"ok":"對。政策說明應該發生甚麼。比對顯示實際發生了甚麼。","no":"那顯示的是意圖，不是實際發生的事。"},{"t":"沒有其他人保存過數目。只有該公司自己的日誌。","q":"你的報告會怎樣寫？","a":["合格","範圍限制：未能證明紀錄完整","不合格"],"r":1,"ok":"對。你不能說它完整，也不能說它不完整。就照這樣寫。","no":"你沒有證據作出這個結論。"}],"src":[["Lloyd's Market Association 通告 LMA25-029-DG：承保代理審核範圍於2025年10月22日更新，以反映網絡及人工智能風險（英文）","https://lmalloyds.com/coverholder-audit-scope-and-associated-guidance/"]]}],"x":["VerZan Check：證明檔案沒有被改動","Find the Gap：五分鐘練習","Ask the Record：六個兩分鐘練習"]},"zh-TW":{"name":"繁體中文（台灣）","home":"向紀錄發問","intro":"無論你是誰，面對人工智能代理的紀錄，都有一條問題值得問。請選擇你的位置。每個練習約需兩分鐘。你在這裏所做的一切都不會離開本頁。","pick":"我是","back":"選擇另一個位置","next":"下一步","yourq":"你應該問的問題","src":"資料來源","win":"你答對了。","limits":"這些是教學練習。除註明來源外，案例均屬虛構。它們不是產品、證書、證據或意見。找不到缺口，並不證明沒有遺漏。背後的測試草案只由我們自行執行，尚未經第三方獨立重現。","foot":"StS Forensics Ltd，2026年。Apache-2.0。不追蹤、不使用 Cookie、不上載任何資料。","mt":"機器翻譯，與香港繁體版相同，用詞未按台灣習慣調整，尚未經母語人士審閱。以英文版為準。","more":[["較詳細的示範","https://stsforensics.github.io/completeness-demo/"],["測試草案，徵求意見至2026年12月1日（英文）","https://doi.org/10.5281/zenodo.23857888"]],"A":[{"id":"user","name":"用戶","ask":"我能看到它替我做了甚麼嗎？","steps":[{"t":"一宗真實個案。2022年，一名旅客向航空公司網站的聊天機械人查詢喪親票價，並把回覆截圖保存。該回覆是錯的。2024年2月，卑詩省一個審裁處裁定航空公司須為其聊天機械人所說的話負責。","q":"他憑甚麼證明聊天機械人對他說過甚麼？","a":["航空公司自己的紀錄","他當時自己保存的截圖","在網上發表的投訴"],"r":1,"ok":"對。裁決記載他提交了聊天機械人回覆的截圖。他手上有自己的副本。","no":"裁決提到的是他自己保存的東西。"},{"t":"現在設想一個替你辦事的人工智能代理：它會預訂、取消和付款。你從未見過的行動，你無法截圖。","q":"你應該可以取得甚麼？","a":["代理自己寫的摘要","它每一項行動連同時間的清單，以及核實清單完整的方法","星級評分"],"r":1,"ok":"對。一個回覆，有截圖已經足夠。至於行動，你需要那份清單，還要有辦法知道沒有遺漏。","no":"那只是代理在形容自己。"}],"src":[["Moffatt v. Air Canada，2024 BCCRT 149，卑詩省 Civil Resolution Tribunal，2024年2月14日（第15段提及截圖；英文）","https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do"]]},{"id":"company","name":"使用人工智能代理的公司","ask":"你能向外人證明紀錄是完整的嗎？","steps":[{"t":"一名客戶指你的人工智能助理令他蒙受損失。他的律師要求取得紀錄。你能證明沒有任何一項紀錄在寫入後被改動。","q":"這樣足夠嗎？","a":["足夠：沒有改動就是可靠","不足夠：下一條問題是，這是否全部紀錄","足夠，只要日誌夠長"],"r":1,"ok":"對。沒有改動和完整是兩條不同的問題，而對方會問的是第二條。","no":"紀錄可以沒有被改動，卻仍然缺少項目。"},{"t":"對方要求你證明紀錄完整。","q":"甚麼東西可以讓你向外人證明這一點？","a":["你自己資訊科技部門的聲明","當時已交予一個不受你控制的人保存的數目或檢查點","一個更大的日誌檔案"],"r":1,"ok":"對。你自己為自己的紀錄作保，是弱的一方。當時已交予另一方保存的東西，才是強的一方。","no":"這仍然是你自己替自己作保。"}],"src":[["歐盟產品責任指令 2024/2853：軟件屬於產品（第4條）；如被告沒有按第9(1)條披露相關證據，第10(2)(a)條訂明可推定產品有缺陷","https://eur-lex.europa.eu/eli/dir/2024/2853/oj"]]},{"id":"engineer","name":"工程師","ask":"甚麼可以告訴你有一項紀錄不見了，而不只是有一項被改過？","steps":[{"t":"你的代理日誌是一條雜湊鏈：每項紀錄都載有上一項的雜湊值。","q":"單靠這條鏈，哪一種情況是查不出來的？","a":["中間一項紀錄被修改","中間一項紀錄被移除","在任何人把鏈錨定之前，最後幾項紀錄被刪去"],"r":2,"ok":"對。雜湊鏈能顯示中間的修改和缺口。缺了尾段的鏈，看起來只是一條較短而完全有效的鏈。","no":"這一種雜湊鏈查得出：雜湊值會對不上。"},{"t":"更壞的情況：代理發出了一次呼叫，卻從來沒有寫下紀錄。","q":"甚麼可以查出這種情況？","a":["更強的雜湊算法","每項紀錄都加上簽署","第二個觀察者，例如接收呼叫的服務，自己另行點算"],"r":2,"ok":"對。紀錄之內沒有任何東西能顯示從未被記下的事。只有另一個見過那次呼叫的人才能做到。","no":"那只保護已寫下的東西。問題在於沒有寫下的東西。"}],"src":[["Di Ma 與 Gene Tsudik，A New Approach to Secure Logging（2008年，公開取用，英文）：討論截斷攻擊，即刪去日誌末段的紀錄","https://eprint.iacr.org/2008/185"]]},{"id":"regulator","name":"監管機構或政策制訂者","ask":"這份紀錄涵蓋甚麼？外面有誰可以查核？","steps":[{"t":"一名營運者報告：代理日誌保存180日，完整性已驗證。","q":"你仍然不知道甚麼？","a":["沒有：這已是完整的答案","紀錄涵蓋甚麼，以及營運者以外有沒有人可以查核","只有檔案格式"],"r":1,"ok":"對。保存期和完整性說明紀錄如何保管。涵蓋範圍和外部查核，才說明這份紀錄能否倚賴。","no":"這份報告欠了兩樣東西。"},{"t":"一名審核員未獲准查閱代理日誌。審核報告沒有就日誌列出任何發現。","q":"這應該怎樣解讀？","a":["當作合格","當作審核的局限，而不是一切妥當的證據","當作違規的證明"],"r":1,"ok":"對。印度的 CERT-In 用一句話說明：未能查閱，並不是符合要求的證據。","no":"未能查閱，就是兩方面都沒有結論。"}],"src":[["CERT-In《人工智能保安審核指引》，2026年11月4日，第4.7及7.9節（英文）","https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf"],["英國政府2026年11月3日的資料便覽：將就代理式人工智能事故後的證據保存進行諮詢（英文）","https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures"]]},{"id":"insurer","name":"保險公司、再保險公司或經紀","ask":"在賠付或定價之前：這是全部紀錄嗎？由誰來說？","steps":[{"t":"在倫敦市場的訊息交換中，一組訊息附有組別參考編號和數目，接收方因此可以核對該組是否齊全，不齊全便拒收。","q":"一個人工智能代理在一宗索償中執行了40個步驟。它的步驟有沒有同等的核對？","a":["有，同一個數目已涵蓋","沒有，除非當時已把代理步驟的數目交予某人保存","人工智能不需要"],"r":1,"ok":"對。市場已經為訊息核對是否齊全。至於代理在訊息以外所做的事，目前還沒有人這樣做。","no":"訊息數目涵蓋的是訊息，不是代理本身的活動。"},{"t":"現在要為代理的步驟保存一個數目。","q":"應該由誰持有？","a":["運行代理的一方","運行代理一方以外的人","不用任何人持有：日後可以重建"],"r":1,"ok":"對。只由營運者持有的數目，等於營運者自己批改自己的功課。","no":"這樣又是營運者替自己作保。"}],"src":[["ACORD GRLC 常見問題：分組、組別參考編號及訊息數目（英文）","https://www.acord.org/standards-architecture/acord-data-standards/Global_Reinsurance_Data_Standards/grlc-faqs"]]},{"id":"auditor","name":"審核員","ask":"你把日誌和甚麼作比對？","steps":[{"t":"你正在審核一間承保代理（coverholder）。通用的審核範圍現已包括網絡風險和人工智能風險。該公司出示一份人工智能政策，並表示代理日誌有保存。","q":"你會要求甚麼證據？","a":["人工智能政策的副本","抽查一日：把代理日誌的數目與另一方所保存的數目並排比對","儀表板的截圖"],"r":1,"ok":"對。政策說明應該發生甚麼。比對顯示實際發生了甚麼。","no":"那顯示的是意圖，不是實際發生的事。"},{"t":"沒有其他人保存過數目。只有該公司自己的日誌。","q":"你的報告會怎樣寫？","a":["合格","範圍限制：未能證明紀錄完整","不合格"],"r":1,"ok":"對。你不能說它完整，也不能說它不完整。就照這樣寫。","no":"你沒有證據作出這個結論。"}],"src":[["Lloyd's Market Association 通告 LMA25-029-DG：承保代理審核範圍於2025年10月22日更新，以反映網絡及人工智能風險（英文）","https://lmalloyds.com/coverholder-audit-scope-and-associated-guidance/"]]}],"x":["VerZan Check：證明檔案沒有被改動","Find the Gap：五分鐘練習","Ask the Record：六個兩分鐘練習"]},"zh-CN":{"name":"简体中文","home":"向纪录发问","intro":"无论你是谁，面对人工智能代理的纪录，都有一条问题值得问。请选择你的位置。每个练习约需两分钟。你在这里所做的一切都不会离开本页。","pick":"我是","back":"选择另一个位置","next":"下一步","yourq":"你应该问的问题","src":"资料来源","win":"你答对了。","limits":"这些是教学练习。除注明来源外，案例均属虚构。它们不是产品、证书、证据或意见。找不到缺口，并不证明没有遗漏。背后的测试草案只由我们自行执行，尚未经第三方独立重现。","foot":"StS Forensics Ltd，2026年。Apache-2.0。不追踪、不使用 Cookie、不上载任何资料。","mt":"机器翻译，由繁体中文版自动转换，尚未经母语人士审阅。以英文版为准。","more":[["较详细的示范","https://stsforensics.github.io/completeness-demo/"],["测试草案，征求意见至2026年12月1日（英文）","https://doi.org/10.5281/zenodo.23857888"]],"A":[{"id":"user","name":"用户","ask":"我能看到它替我做了甚么吗？","steps":[{"t":"一宗真实个案。2022年，一名旅客向航空公司网站的聊天机械人查询丧亲票价，并把回复截图保存。该回复是错的。2024年2月，卑诗省一个审裁处裁定航空公司须为其聊天机械人所说的话负责。","q":"他凭甚么证明聊天机械人对他说过甚么？","a":["航空公司自己的纪录","他当时自己保存的截图","在网上发表的投诉"],"r":1,"ok":"对。裁决记载他提交了聊天机械人回复的截图。他手上有自己的副本。","no":"裁决提到的是他自己保存的东西。"},{"t":"现在设想一个替你办事的人工智能代理：它会预订、取消和付款。你从未见过的行动，你无法截图。","q":"你应该可以取得甚么？","a":["代理自己写的摘要","它每一项行动连同时间的清单，以及核实清单完整的方法","星级评分"],"r":1,"ok":"对。一个回复，有截图已经足够。至于行动，你需要那份清单，还要有办法知道没有遗漏。","no":"那只是代理在形容自己。"}],"src":[["Moffatt v. Air Canada，2024 BCCRT 149，卑诗省 Civil Resolution Tribunal，2024年2月14日（第15段提及截图；英文）","https://decisions.civilresolutionbc.ca/crt/crtd/en/525448/1/document.do"]]},{"id":"company","name":"使用人工智能代理的公司","ask":"你能向外人证明纪录是完整的吗？","steps":[{"t":"一名客户指你的人工智能助理令他蒙受损失。他的律师要求取得纪录。你能证明没有任何一项纪录在写入后被改动。","q":"这样足够吗？","a":["足够：没有改动就是可靠","不足够：下一条问题是，这是否全部纪录","足够，只要日志够长"],"r":1,"ok":"对。没有改动和完整是两条不同的问题，而对方会问的是第二条。","no":"纪录可以没有被改动，却仍然缺少项目。"},{"t":"对方要求你证明纪录完整。","q":"甚么东西可以让你向外人证明这一点？","a":["你自己资讯科技部门的声明","当时已交予一个不受你控制的人保存的数目或检查点","一个更大的日志档案"],"r":1,"ok":"对。你自己为自己的纪录作保，是弱的一方。当时已交予另一方保存的东西，才是强的一方。","no":"这仍然是你自己替自己作保。"}],"src":[["欧盟产品责任指令 2024/2853：软件属于产品（第4条）；如被告没有按第9(1)条披露相关证据，第10(2)(a)条订明可推定产品有缺陷","https://eur-lex.europa.eu/eli/dir/2024/2853/oj"]]},{"id":"engineer","name":"工程师","ask":"甚么可以告诉你有一项纪录不见了，而不只是有一项被改过？","steps":[{"t":"你的代理日志是一条杂凑链：每项纪录都载有上一项的杂凑值。","q":"单靠这条链，哪一种情况是查不出来的？","a":["中间一项纪录被修改","中间一项纪录被移除","在任何人把链锚定之前，最后几项纪录被删去"],"r":2,"ok":"对。杂凑链能显示中间的修改和缺口。缺了尾段的链，看起来只是一条较短而完全有效的链。","no":"这一种杂凑链查得出：杂凑值会对不上。"},{"t":"更坏的情况：代理发出了一次呼叫，却从来没有写下纪录。","q":"甚么可以查出这种情况？","a":["更强的杂凑算法","每项纪录都加上签署","第二个观察者，例如接收呼叫的服务，自己另行点算"],"r":2,"ok":"对。纪录之内没有任何东西能显示从未被记下的事。只有另一个见过那次呼叫的人才能做到。","no":"那只保护已写下的东西。问题在于没有写下的东西。"}],"src":[["Di Ma 与 Gene Tsudik，A New Approach to Secure Logging（2008年，公开取用，英文）：讨论截断攻击，即删去日志末段的纪录","https://eprint.iacr.org/2008/185"]]},{"id":"regulator","name":"监管机构或政策制订者","ask":"这份纪录涵盖甚么？外面有谁可以查核？","steps":[{"t":"一名营运者报告：代理日志保存180日，完整性已验证。","q":"你仍然不知道甚么？","a":["没有：这已是完整的答案","纪录涵盖甚么，以及营运者以外有没有人可以查核","只有档案格式"],"r":1,"ok":"对。保存期和完整性说明纪录如何保管。涵盖范围和外部查核，才说明这份纪录能否倚赖。","no":"这份报告欠了两样东西。"},{"t":"一名审核员未获准查阅代理日志。审核报告没有就日志列出任何发现。","q":"这应该怎样解读？","a":["当作合格","当作审核的局限，而不是一切妥当的证据","当作违规的证明"],"r":1,"ok":"对。印度的 CERT-In 用一句话说明：未能查阅，并不是符合要求的证据。","no":"未能查阅，就是两方面都没有结论。"}],"src":[["CERT-In《人工智能保安审核指引》，2026年11月4日，第4.7及7.9节（英文）","https://www.cert-in.org.in/PDF/AI_Security_Auditing_Guidelines.pdf"],["英国政府2026年11月3日的资料便览：将就代理式人工智能事故后的证据保存进行咨询（英文）","https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures"]]},{"id":"insurer","name":"保险公司、再保险公司或经纪","ask":"在赔付或定价之前：这是全部纪录吗？由谁来说？","steps":[{"t":"在伦敦市场的讯息交换中，一组讯息附有组别参考编号和数目，接收方因此可以核对该组是否齐全，不齐全便拒收。","q":"一个人工智能代理在一宗索偿中执行了40个步骤。它的步骤有没有同等的核对？","a":["有，同一个数目已涵盖","没有，除非当时已把代理步骤的数目交予某人保存","人工智能不需要"],"r":1,"ok":"对。市场已经为讯息核对是否齐全。至于代理在讯息以外所做的事，目前还没有人这样做。","no":"讯息数目涵盖的是讯息，不是代理本身的活动。"},{"t":"现在要为代理的步骤保存一个数目。","q":"应该由谁持有？","a":["运行代理的一方","运行代理一方以外的人","不用任何人持有：日后可以重建"],"r":1,"ok":"对。只由营运者持有的数目，等于营运者自己批改自己的功课。","no":"这样又是营运者替自己作保。"}],"src":[["ACORD GRLC 常见问题：分组、组别参考编号及讯息数目（英文）","https://www.acord.org/standards-architecture/acord-data-standards/Global_Reinsurance_Data_Standards/grlc-faqs"]]},{"id":"auditor","name":"审核员","ask":"你把日志和甚么作比对？","steps":[{"t":"你正在审核一间承保代理（coverholder）。通用的审核范围现已包括网络风险和人工智能风险。该公司出示一份人工智能政策，并表示代理日志有保存。","q":"你会要求甚么证据？","a":["人工智能政策的副本","抽查一日：把代理日志的数目与另一方所保存的数目并排比对","仪表板的截图"],"r":1,"ok":"对。政策说明应该发生甚么。比对显示实际发生了甚么。","no":"那显示的是意图，不是实际发生的事。"},{"t":"没有其他人保存过数目。只有该公司自己的日志。","q":"你的报告会怎样写？","a":["合格","范围限制：未能证明纪录完整","不合格"],"r":1,"ok":"对。你不能说它完整，也不能说它不完整。就照这样写。","no":"你没有证据作出这个结论。"}],"src":[["Lloyd's Market Association 通告 LMA25-029-DG：承保代理审核范围于2025年10月22日更新，以反映网络及人工智能风险（英文）","https://lmalloyds.com/coverholder-audit-scope-and-associated-guidance/"]]}],"x":["VerZan Check：证明档案没有被改动","Find the Gap：五分钟练习","Ask the Record：六个两分钟练习"]}};
